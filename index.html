<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>⚡ 整合包模组管理工具 · Modrinth</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--accent:#0078d4;--accent-h:#106ebe;--accent2:#8b5cf6;--accent2-h:#7c3aed;
--success:#16a34a;--warning:#d97706;--danger:#dc2626;
--gray:#e0e0e0;--gray-h:#d0d0d0;--text-light:#1a1a1a;--text-dark:#fff;
--mica:#fafbfc;--mica-strong:#f0f2f5;--header:#e8e8e8;--zebra:#fafafa;--border:#d0d0d0;
--row-hover:#e5efff;--selected:#cce4f7;--text:#1a1a1a;--muted:#6b7280}
[data-theme="dark"]{--accent:#2d7dd2;--accent-h:#2a6cb0;--accent2:#7d5ba6;--accent2-h:#6b4a8f;
--success:#3a8a3a;--warning:#b08a2a;--danger:#b8383d;
--gray:#2a2a2a;--gray-h:#3d3d3d;--text-light:#e5e5e5;--text-dark:#fff;
--mica:#252525;--mica-strong:#2d2d2d;--header:#1a1a1a;--zebra:#1f1f1f;--border:#3a3a3a;
--row-hover:#232c3a;--selected:#294058;--text:#e5e5e5;--muted:#9ca3af}
*{margin:0;padding:0;box-sizing:border-box}
body{font:13px 'Segoe UI',system-ui,sans-serif;background:var(--mica);color:var(--text);
height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font:12px 'Segoe UI',system-ui,sans-serif;cursor:pointer;border:none;border-radius:8px;
height:34px;padding:0 14px;color:var(--text-dark);transition:background .12s;white-space:nowrap}
button:active{opacity:.85}
input,select{font:13px 'Segoe UI',system-ui,sans-serif;padding:5px 9px;border:1px solid var(--border);
border-radius:4px;background:var(--mica-strong);color:var(--text);outline:none;height:30px}
input:focus{border-color:var(--accent)}
.btn-gray{background:var(--gray);color:var(--text-light)}.btn-gray:hover{background:var(--gray-h)}
.btn-accent{background:var(--accent)}.btn-accent:hover{background:var(--accent-h)}
.btn-accent2{background:var(--accent2)}.btn-accent2:hover{background:var(--accent2-h)}
.btn-success{background:var(--success)}.btn-danger{background:var(--danger)}
.btn-warning{background:var(--warning)}

/* 顶栏 */
#bar{display:flex;align-items:center;height:56px;margin:12px 12px 10px;padding:0 20px;
background:var(--mica-strong);border:1px solid var(--border);border-radius:12px;flex-shrink:0}
#bar .t{font-size:20px;font-weight:600;color:var(--accent)}
#bar .sub{font-size:12px;color:var(--muted);margin-left:10px}
#bar .tool{margin-left:auto;display:flex;gap:10px}
#bar .tool button{width:90px;padding:0 4px}

/* 主体 */
#body{flex:1;display:grid;grid-template-columns:4fr 1fr;gap:8px;padding:0 12px;overflow:hidden;min-height:0}
#left{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;min-width:0}
#right{display:flex;flex-direction:column;overflow:hidden}
.group{background:var(--mica);border:1px solid var(--border);border-radius:12px;
padding:0 14px 12px;margin-bottom:10px}
.group>.gtitle{font-weight:600;color:var(--accent);padding:10px 0 6px}
#groupList{display:flex;flex-direction:column;flex:1;min-height:0}

/* 模式 radio */
.radio-row{display:flex;gap:24px;padding:2px 0}
.radio-item{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;user-select:none}
.radio-dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--accent);position:relative;flex-shrink:0}
.radio-item.on .radio-dot::after{content:'';position:absolute;inset:2px;border-radius:50%;background:var(--accent)}
.mode-hint{font-style:italic;font-size:12px;color:var(--accent);padding-top:5px}

/* 文件行 */
.frow{display:flex;align-items:center;gap:5px}
.frow .lbl{font-size:12px;flex-shrink:0}
.frow input{flex:1;min-width:80px}

/* 信息区折叠 */
#infoToggle{width:90px;margin-bottom:6px}
#infoContent{background:var(--mica-strong);border-radius:10px;overflow:hidden;
transition:height .15s;height:2px;padding:0 5px}
#infoContent.open{height:auto;padding:8px 5px}
.info-grid{display:grid;grid-template-columns:auto 220px auto;gap:6px 6px;align-items:center}
.info-grid .ilbl{font-size:12px;text-align:right;padding-right:4px}
.info-grid select,.info-grid input{width:220px}
.mini-btn{width:30px;height:30px;border-radius:8px;font-size:13px;padding:0}
.compat{font-size:12px;font-weight:600}
.compat.ok{color:var(--success)}.compat.bad{color:var(--danger)}.compat.warn{color:var(--warning)}

/* 模组列表 */
.tool-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.tool-row button{flex-shrink:0}
#searchEntry{flex:1;min-width:120px}
#btnClearSearch{width:30px;padding:0}
#btnAddLocal{display:none}
body.offline #btnAddLocal{display:block}
.tbl-hdr{display:flex;height:40px;background:var(--header);border:1px solid var(--border);
border-radius:10px;align-items:center;overflow:hidden}
.tbl-hdr div{font-weight:600;font-size:13px;color:var(--text);padding:4px;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
#tree{overflow-y:auto;border-radius:10px;margin-top:4px;flex:1;min-height:120px;
background:var(--zebra)}
.mrow{display:flex;height:32px;align-items:center;border-radius:4px;cursor:default;overflow:hidden}
.mrow div{font-size:12px;padding:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.mrow.zebra{background:var(--zebra)}
.mrow:hover{background:var(--row-hover)}
.mrow.sel{background:var(--selected)}
.empty-hint{padding:20px;text-align:center;color:var(--muted);font-size:12px}

/* 日志 */
#groupLog{flex:1;display:flex;flex-direction:column;min-height:0;margin-bottom:0}
#logText{flex:1;overflow-y:auto;font:12px Consolas,'Cascadia Mono',monospace;white-space:pre-wrap;
word-break:break-all;background:var(--mica-strong);border:1px solid var(--border);
border-radius:8px;padding:6px 8px;min-height:100px}

/* 状态栏 */
#status{height:30px;background:var(--gray);color:var(--text-light);display:flex;align-items:center;
padding:0 12px;font-size:12px;flex-shrink:0;margin-top:0}
#statusTxt{flex:1}
#offlineInd{font-weight:600}

/* 底部按钮组 */
#bottomBtns{display:flex;gap:6px;padding:6px 0;justify-content:center}
#bottomBtns button{width:130px}
#btnPack{width:auto}

/* 模态窗口 */
.win-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:99;
align-items:center;justify-content:center}
.win-ov.show{display:flex}
.win{background:var(--mica);border:1px solid var(--border);border-radius:12px;
box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.win-hd{padding:10px 16px;font-weight:600;color:var(--accent);font-size:16px;border-bottom:1px solid var(--border);
display:flex;justify-content:space-between;align-items:center}
.win-hd .x{background:none;border:none;color:var(--muted);font-size:16px;height:auto;padding:2px 6px}
.win-hd .x:hover{color:var(--text)}
.win-bd{flex:1;overflow-y:auto;padding:8px 10px;min-height:0}
.win-ft{padding:8px 10px;display:flex;gap:8px;justify-content:center;border-top:1px solid var(--border)}
.sel-row{display:flex;align-items:center;border-radius:4px;padding:2px 0;cursor:pointer}
.sel-row:hover{background:var(--row-hover)}
.sel-row.on{background:var(--accent);color:#fff}
.sel-row.zebra{background:var(--zebra)}
.sel-row.zebra:hover,.sel-row.zebra.on{background:var(--row-hover)}
.sel-row.zebra.on{background:var(--accent);color:#fff}
.sel-row div{font-size:12px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.hint{font-size:12px;color:var(--muted)}
.italic-warn{font-style:italic;font-size:12px;color:var(--warning);text-align:center;padding:2px 0}
.bold-md{font-size:16px;font-weight:600;text-align:center;padding:10px 0 2px}
</style>
</head>
<body>
<div id="bar">
  <span class="t" id="tTitle"></span><span class="sub" id="tSub"></span>
  <span class="tool">
    <button class="btn-gray" id="btnTheme" onclick="toggle_theme()"></button>
    <button class="btn-gray" id="btnLang" onclick="toggle_lang()"></button>
    <button class="btn-gray" id="btnOffline" onclick="toggle_offline()"></button>
  </span>
</div>

<div id="body">
<div id="left">
  <div class="group"><div class="gtitle" id="gMode"></div>
    <div class="radio-row">
      <span class="radio-item" id="radNew" onclick="set_mode('new')"><span class="radio-dot"></span><span id="radNewTxt"></span></span>
      <span class="radio-item" id="radExist" onclick="set_mode('existing')"><span class="radio-dot"></span><span id="radExistTxt"></span></span>
    </div>
  </div>

  <div class="group"><div class="gtitle" id="gFile"></div>
    <div class="frow">
      <span class="lbl" id="lblPath"></span>
      <input id="entryFile" readonly placeholder="modrinth.index.json">
      <button class="btn-accent" style="width:80px" id="btnBrowse" onclick="browse_file()"></button>
      <button class="btn-accent2" style="width:110px" id="btnOpenMrpack" onclick="open_mrpack()"></button>
    </div>
    <div class="mode-hint" id="modeHint"></div>
  </div>

  <div class="group"><div class="gtitle" id="gInfo"></div>
    <button class="btn-gray" id="infoToggle" onclick="toggle_info()">▶ 展开</button>
    <div id="infoContent">
      <div class="info-grid">
        <span class="ilbl" id="lblName"></span><input id="entryName" value="我的整合包">
        <span></span>
        <span class="ilbl" id="lblVersion"></span><input id="entryVersion" value="1.0.0">
        <span></span>
        <span class="ilbl" id="lblMc"></span>
        <select id="comboMc"><option>1.20.1</option></select>
        <button class="btn-gray mini-btn" onclick="fetch_mc_versions()">🔄</button>
        <span class="ilbl" id="lblLoader"></span>
        <select id="comboLoaderType" onchange="loader_type_changed()">
          <option>Fabric</option><option>Forge</option><option>NeoForge</option>
        </select>
        <span></span>
        <span class="ilbl" id="lblLoaderVer"></span>
        <select id="comboLoaderVer"><option value=""></option></select>
        <span style="display:flex;gap:6px;align-items:center">
          <button class="btn-gray mini-btn" onclick="fetch_fabric_versions(true)">🔄</button>
          <span class="compat" id="compatLabel"></span>
        </span>
      </div>
    </div>
  </div>

  <div class="group"><div class="gtitle" id="gAdd"></div>
    <div class="frow">
      <span class="lbl" id="lblAddPlaceholder"></span>
      <input id="urlEntry" placeholder="https://modrinth.com/mod/... 或项目 ID">
      <button class="btn-accent2" style="width:100px" id="btnFetch" onclick="fetch_versions_from_url()"></button>
    </div>
  </div>

  <div class="group" id="groupList" style="flex:1;display:flex;flex-direction:column">
    <div class="gtitle" id="gList"></div>
    <div class="tool-row">
      <span style="font-size:14px">🔍</span>
      <input id="searchEntry" oninput="debounce_filter()">
      <button class="btn-gray" id="btnClearSearch" onclick="clear_search()">✕</button>
    </div>
    <div class="tool-row">
      <button class="btn-accent" style="width:110px" id="btnRefresh" onclick="refresh_mod_list()"></button>
      <button class="btn-danger" style="width:110px" id="btnDelete" onclick="delete_selected()"></button>
      <button class="btn-warning" style="width:110px" id="btnFolder" onclick="open_mods_folder()"></button>
      <button class="btn-accent2" style="width:150px" id="btnCheckUpd" onclick="check_updates()"></button>
      <button class="btn-gray" style="width:110px" id="btnExport" onclick="export_mod_list()"></button>
      <button class="btn-gray" style="width:110px" id="btnImport" onclick="import_mod_list()"></button>
      <button class="btn-accent2" style="width:130px" id="btnAddLocal" onclick="add_local_jar()"></button>
    </div>
    <div class="tbl-hdr" id="listHdr"></div>
    <div id="tree"></div>
  </div>

  <div id="bottomBtns">
    <button class="btn-gray" id="btnBackup" onclick="manual_backup()"></button>
    <button class="btn-gray" id="btnReload" onclick="reload_metadata()"></button>
    <button class="btn-accent" id="btnPack" onclick="pack_to_mrpack()"></button>
  </div>
</div>

<div id="right">
  <div class="group" id="groupLog"><div class="gtitle" id="gLog"></div>
    <div id="logText"></div>
  </div>
</div>
</div>

<div id="status">
  <span id="statusTxt"></span>
  <span id="offlineInd"></span>
</div>

<input type="file" id="fileJson" accept=".json" hidden>
<input type="file" id="fileMrpack" accept=".mrpack,.zip" hidden>
<input type="file" id="fileJar" accept=".jar" hidden>
<input type="file" id="fileCsv" accept=".csv" hidden>
<input type="file" id="fileOverrides" webkitdirectory multiple hidden>

/* ---------- 工具函数（照抄 Python） ---------- */
function normalize_version(v){v=String(v||'').trim();
  v=v.replace(/^mc[\d.\-]+-/,'');v=v.replace(/[+\-]fabric.*$/,'');
  v=v.replace(/[+\-]forge.*$/,'');v=v.replace(/[+\-]neoforge.*$/,'');
  v=v.replace(/\+\d{1,3}(\.\d{1,3}){0,2}$/,'');return v;}
function extract_version(filename){const m=String(filename||'').match(/(\d+(?:\.\d+)+)/);
  return m?m[1]:'未知版本';}
function compare_simple(v1,v2){const p=v=>normalize_version(v).match(/\d+/g)||[];
  const a=p(v1).map(Number),b=p(v2).map(Number);
  if(!a.length&&!b.length)return 0;if(!a.length)return -1;if(!b.length)return 1;
  for(let i=0;i<Math.max(a.length,b.length);i++){
    const n1=a[i]||0,n2=b[i]||0;if(n1!==n2)return n1-n2;}return 0;}
function parse_project_id_from_url(url){if(!url)return null;
  let m=String(url).match(/cdn\.modrinth\.com\/data\/([a-zA-Z0-9_-]+)/);
  if(m)return m[1];
  m=String(url).match(/modrinth\.com\/(?:mod|project)\/([a-zA-Z0-9_-]+)/);
  if(m)return m[1];
  const last=String(url).split('/').pop();
  if(/^[a-zA-Z0-9_-]+$/.test(last))return last;return null;}
function parse_project_id(url){const m=String(url).match(/modrinth\.com\/(?:mod|project)\/([a-zA-Z0-9_-]+)/);
  if(m)return m[1];if(/^[a-zA-Z0-9_-]+$/.test(url))return url;return null;}
async function sha1_hex(buf){const h=await crypto.subtle.digest('SHA-1',buf);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function sha512_hex(buf){const h=await crypto.subtle.digest('SHA-512',buf);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}

/* ---------- API（requests → fetch） ---------- */
async function api_get(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function api_fetch_mc_versions(){if(MC_CACHE)return MC_CACHE;
  const d=await api_get('https://api.modrinth.com/v2/tag/game_version');
  MC_CACHE=d.filter(v=>['release','beta','alpha'].includes(v.version_type)).map(v=>v.version);return MC_CACHE;}
async function api_fetch_fabric_versions(force){
  const cached=FABRIC_CACHE.all;
  if(cached&&!force)return[cached,FABRIC_CACHE.map];
  try{const d=await api_get('https://meta.fabricmc.net/v2/versions/loader');
    const versions=[],map={};
    for(const item of (Array.isArray(d)?d:[])){
      const v=item&&item.loader?item.loader.version:(item&&item.version);
      const gvs=(item&&item.gameVersions)||[];
      if(v){versions.push(v);if(gvs.length)map[v]=gvs;}}
    if(versions.length||cached===null){FABRIC_CACHE.all=versions;FABRIC_CACHE.map=map;FABRIC_CACHE.byMc={};
      return[versions,map];}
  }catch{}
  if(cached)return[cached,FABRIC_CACHE.map];
  return[[],{}];}
async function api_fetch_fabric_for_mc(mc,force){
  if(!force&&FABRIC_CACHE.byMc[mc])return FABRIC_CACHE.byMc[mc];
  try{const d=await api_get(`https://meta.fabricmc.net/v2/versions/loader/${encodeURIComponent(mc)}`);
    const versions=(Array.isArray(d)?d:[]).map(x=>x&&x.loader?x.loader.version:(x&&x.version)).filter(Boolean);
    if(versions.length){FABRIC_CACHE.byMc[mc]=versions;return versions;}}
  catch{}
  const[all,map]=await api_fetch_fabric_versions(false);
  let compatible=Object.keys(map).filter(v=>(map[v]||[]).includes(mc));
  if(!compatible.length)compatible=all.slice();
  FABRIC_CACHE.byMc[mc]=compatible;return compatible;}
async function api_fetch_project_name(pid){if(NAME_CACHE[pid])return NAME_CACHE[pid];
  try{const d=await api_get(`https://api.modrinth.com/v2/project/${pid}`);
    NAME_CACHE[pid]=d.title||pid;}catch{NAME_CACHE[pid]=pid;}
  return NAME_CACHE[pid];}
async function api_get_all_versions(pid,mc,loader){
  const all_v=[];let offset=0;const limit=100;
  while(true){
    const p=new URLSearchParams({limit:String(limit),offset:String(offset)});
    if(mc)p.set('game_versions',JSON.stringify([mc]));
    if(loader)p.set('loaders',JSON.stringify([loader]));
    try{const batch=await api_get(`https://api.modrinth.com/v2/project/${pid}/version?${p}`);
      if(!Array.isArray(batch)||!batch.length)break;
      all_v.push(...batch);
      if(batch.length<limit)break;
      offset+=limit;}
    catch{break;}}
  return all_v;}
async function api_get_latest_version(pid,mc,loader){
  try{const list=await api_get_all_versions(pid,mc,loader);return list[0]||null;}catch{return null;}}

function apply_metadata(data){try{
  $('entryName').value=data.name||'';
  $('entryVersion').value=data.versionId||'';
  const deps=data.dependencies||{};
  $('comboMc').value=deps.minecraft||'';
  let loader='Fabric',lv='';
  for(const ln of['Fabric','Forge','NeoForge']){const k=LOADER_KEYS[ln];
    if(deps[k]){loader=ln;lv=deps[k];break;}}
  $('comboLoaderType').value=loader;
  if(lv){const sel=$('comboLoaderVer');
    if(![...sel.options].some(o=>o.value===lv)){const o=document.createElement('option');o.value=o.textContent=lv;sel.appendChild(o);}
    sel.value=lv;}
  check_loader_compatibility();
  log(`加载: 名称='${data.name||''}', MC='${deps.minecraft||''}', 加载器='${loader}', 版本='${lv}'`);
}catch(e){log(trf('dialog_parse_error',{error:e.message}),'ERROR');}}

  apply_metadata(INDEX_DATA);refresh_mod_list();}
function save_index_to_state(){if(!INDEX_DATA)return false;
  INDEX_DATA.name=$('entryName').value.trim();
  INDEX_DATA.versionId=$('entryVersion').value.trim();
  INDEX_DATA.dependencies=INDEX_DATA.dependencies||{};
  INDEX_DATA.dependencies.minecraft=$('comboMc').value.trim();
  const k=LOADER_KEYS[$('comboLoaderType').value];
  if($('comboLoaderVer').value)INDEX_DATA.dependencies[k]=$('comboLoaderVer').value.trim();
  INDEX_DATA.files=ALL_MODS.map(m=>m.raw_entry);
  if(window._indexHandle){
    window._indexHandle.createWritable()
      .then(w=>w.write(JSON.stringify(INDEX_DATA,null,2)).then(()=>w.close()))
      .catch(()=>{});}
  return true;}
function manual_backup(){if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  save_index_to_state();
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const ts=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  const name=`${$('entryFile').value||'modrinth.index.json'}.backup_${ts}`;
  dl_blob(new Blob([JSON.stringify(INDEX_DATA,null,2)],{type:'application/json'}),name);
  log(trf('dialog_backup_success',{path:name}),'SUCCESS');
  set_status(tr('status_backup'));}
function dl_blob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);}

/* ---------- 模组列表 ---------- */
function current_files(){return INDEX_DATA?INDEX_DATA.files||[]:[];}
function refresh_mod_list(){if(!INDEX_DATA)return;
  ALL_MODS=[];PENDING_NAMES=0;
  for(const entry of current_files()){
    const p=entry.path||'';const filename=p.split(/[/\\]/).pop();
    const version=extract_version(filename);
    let project_id=null;
    if(entry.downloads&&entry.downloads.length)
      project_id=parse_project_id_from_url(entry.downloads[0]);
    const display_name=project_id?(NAME_CACHE[project_id]||filename):filename;
    const mod_entry={path:p,filename,version,display_name,project_id,raw_entry:entry};
    ALL_MODS.push(mod_entry);
    if(project_id&&!NAME_CACHE[project_id]){PENDING_NAMES++;
      async_fetch_name(project_id,mod_entry);}}
  apply_filter();
  log(trf('log_refresh',{count:ALL_MODS.length}),'SUCCESS');}
async function async_fetch_name(pid,mod_entry){
  const name=await api_fetch_project_name(pid);
  mod_entry.display_name=name;PENDING_NAMES--;
  if(PENDING_NAMES<=0)render_rows();}
function debounce_filter(){clearTimeout(FILTER_TIMER);
  FILTER_TIMER=setTimeout(apply_filter,200);}
function clear_search(){$('searchEntry').value='';apply_filter();}
function apply_filter(){const kw=$('searchEntry').value.trim().toLowerCase();
  const filtered=!kw?ALL_MODS:ALL_MODS.filter(e=>
    e.display_name.toLowerCase().includes(kw)||
    e.filename.toLowerCase().includes(kw)||e.path.toLowerCase().includes(kw));
  render_rows(filtered);}
function render_rows(filtered){
  if(filtered===undefined)filtered=arguments[0]||ALL_MODS;
  const tree=$('tree');tree.innerHTML='';ROWS=[];
  const widths=[260,200,120,200];
  filtered.forEach((entry,idx)=>{
    const row=document.createElement('div');
    row.className='mrow'+(idx%2===1?' zebra':'');
    row._raw=entry;row._selected=false;
    const vals=[entry.display_name||entry.filename||'未知',entry.filename||'',entry.version||'',entry.path||''];
    vals.forEach((v,i)=>{const c=document.createElement('div');
      c.style.width=widths[i]+'px';c.textContent=v;
      c.onclick=()=>toggle_row(row);
      c.ondblclick=()=>show_mod_detail(row);
      row.appendChild(c);});
    tree.appendChild(row);ROWS.push(row);});}
function toggle_row(row){row._selected=!row._selected;
  row.classList.toggle('sel',row._selected);}
function selected_rows(){return ROWS.filter(r=>r._selected);}
function delete_selected(){const sel=selected_rows();
  if(!sel.length){alert(tr('dialog_select_mod'));return;}
  if(!confirm(trf('dialog_confirm_delete',{count:sel.length})))return;
  const paths=new Set(sel.map(r=>r._raw.path));
  INDEX_DATA.files=current_files().filter(f=>!paths.has(f.path));
  log(trf('log_delete_mod',{count:sel.length}),'SUCCESS');
  refresh_mod_list();save_index_to_state();reload_metadata();}

function build_mod_entry(version_data){const f=version_data.files[0];
  return{path:`mods/${f.filename}`,hashes:{sha1:f.hashes.sha1,sha512:f.hashes.sha512},
    downloads:[f.url],fileSize:f.size};}
function add_version(version_data){
  try{const f=version_data.files[0];const filename=f.filename;
    const entry=build_mod_entry(version_data);
    if(current_files().some(fe=>fe.path===entry.path)){
      if(!confirm(trf('dialog_version_exists',{filename}))){
        log(trf('log_add_mod',{filename})+' (已存在，取消)','WARNING');return;}}
    if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
    INDEX_DATA.files.push(entry);
    log(trf('log_add_mod',{filename}),'SUCCESS');
    refresh_mod_list();save_index_to_state();
    const deps=(version_data.dependencies||[]).map(d=>d.project_id).filter(Boolean);
    if(deps.length)show_dependency_dialog(deps,filename);

/* ---------- 依赖对话框（照抄 show_dependency_dialog） ---------- */
function show_dependency_dialog(dep_ids,filename){
  build_win(tr('dialog_dep_prompt'),'700px','500px',win=>{
    const title=document.createElement('div');title.className='bold-md';
    title.textContent=trf('dialog_dep_prompt',{filename});win.bd.before(title);
    const installed_ids=new Set();
    current_files().forEach(entry=>{
      if(entry.downloads&&entry.downloads[0]){
        const pid=parse_project_id_from_url(entry.downloads[0]);
        if(pid)installed_ids.add(pid);}});
    const dep_status=[];
    dep_ids.forEach(dep_id=>{const installed=installed_ids.has(dep_id);
      dep_status.push({id:dep_id,name:dep_id,installed});});
    let cur_i=null;const rows=[];
    function select_dep(i){if(cur_i!==null)rows[cur_i].classList.remove('on');
      cur_i=i;rows[i].classList.add('on');}
    function open_selected(){if(cur_i===null){alert('请先选择一个依赖');return;}
      window.open(`https://modrinth.com/mod/${dep_status[cur_i].id}`);}
    function open_all(){dep_status.forEach(d=>window.open(`https://modrinth.com/mod/${d.id}`));}
    async function install_missing(){
      const missing=dep_status.filter(d=>!d.installed);
      if(!missing.length){alert(tr('dialog_dep_no_missing'));return;}
      if(!confirm(tr('dialog_dep_confirm')))return;
      const mc_ver=$('comboMc').value.trim();
      const loader_api=LOADER_API[$('comboLoaderType').value]||'fabric';
      let ok=0;
      for(const d of missing){
        log(trf('log_dep_fetch',{name:d.name}));
        try{const latest=await api_get_latest_version(d.id,mc_ver,loader_api);
          if(!latest){log(trf('dialog_dep_fetch_fail',{name:d.name}),'WARNING');continue;}
          const entry=build_mod_entry(latest);
          if(current_files().some(fe=>fe.path===entry.path)){
            log(trf('log_dep_exists',{name:d.name}),'WARNING');continue;}
          INDEX_DATA.files.push(entry);ok++;
          log(trf('log_dep_added',{name:d.name}),'SUCCESS');
        }catch(e){log(`补齐依赖 ${d.name} 失败: ${e}`,'ERROR');}}
      if(ok>0){alert(trf('dialog_dep_add_success',{count:ok}));
        refresh_mod_list();save_index_to_state();close_win();}
      else alert('没有成功补齐任何依赖，请检查网络或手动添加。');}
    const ft=win.ft;
    ft.append(mkbtn(tr('button_open_selected'),'btn-accent','120px',open_selected),
      mkbtn(tr('button_open_all'),'btn-accent2','100px',open_all),
      mkbtn(tr('button_install_missing'),'btn-success','120px',install_missing),
      mkbtn(tr('button_close'),'btn-gray','80px',close_win));
    dep_status.forEach((d,i)=>{
      const row=document.createElement('div');row.className='sel-row';
      const c=document.createElement('div');c.style.flex='1';
      c.textContent=`加载中... (${d.id}) `+(d.installed?tr('dialog_dep_existing'):tr('dialog_dep_missing'));
      c.style.color=d.installed?'var(--text)':'var(--warning)';
      row.appendChild(c);row.onclick=()=>select_dep(i);
      win.bd.appendChild(row);rows.push(row);});
    // 异步获取依赖名称
    (async()=>{for(const d of dep_status){
      const name=await api_fetch_project_name(d.id);d.name=name;
      rows.forEach((r,i)=>{
        if(!r.isConnected)return;
        const st=dep_status[i];
        r.firstChild.textContent=`${st.name} (${st.id}) `+
          (st.installed?tr('dialog_dep_existing'):tr('dialog_dep_missing'));});}})();});}

function csv_escape(s){return `"${String(s??'').replace(/"/g,'""')}"`;}
function export_mod_list(){if(!ALL_MODS.length){alert(tr('dialog_no_mods'));return;}

  dl_blob(new Blob([csv],{type:'text/csv'}),'modlist.csv');

async function import_mod_list(){if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  $('fileCsv').click();}
$('fileCsv').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  log(`开始从 ${f.name} 导入...`);set_status(tr('status_loading'));
  const mc_ver=$('comboMc').value.trim();
  const loader_api=LOADER_API[$('comboLoaderType').value]||'fabric';
  try{const text=(await f.text()).replace(/^\ufeff/,'');
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    const headers=parse_csv_line(lines[0]);
    const pidCol=headers.findIndex(h=>/project.?id/i.test(h));
    const rows=lines.slice(1).map(parse_csv_line);
    const new_entries=[];let i=0;
    for(const row of rows){i++;
      set_status(`导入中... ${i}/${rows.length}`);
      const pid=(row[pidCol>=0?pidCol:0]||'').trim();
      if(!pid)continue;
      let latest=null;try{latest=await api_get_latest_version(pid,mc_ver,loader_api);}catch{}
      if(!latest){log(`无法找到兼容版本: ${pid}`,'WARNING');continue;}
      try{const entry=build_mod_entry(latest);
        if(!new_entries.some(ne=>ne.path===entry.path))new_entries.push(entry);}
      catch{log(`版本数据异常: ${pid}`,'WARNING');}}
    const existing=new Set(current_files().map(fe=>fe.path));
    const to_add=new_entries.filter(ne=>!existing.has(ne.path));
    if(to_add.length){manual_backup();INDEX_DATA.files.push(...to_add);}
    log(trf('log_import',{path:f.name,count:to_add.length}),'SUCCESS');
    refresh_mod_list();save_index_to_state();
    alert(trf('dialog_import_success',{count:to_add.length}));
  }catch(err){log(trf('dialog_import_fail',{error:err.message}),'ERROR');
    alert(trf('dialog_import_fail',{error:err.message}));}
  set_status(tr('status_ready'));});
function parse_csv_line(line){const out=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(inQ){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c;}
    else if(c==='"')inQ=true;else if(c===','){out.push(cur);cur='';}else cur+=c;}
  out.push(cur);return out;}

/* ---------- 检查更新（照抄 check_updates 流程） ---------- */
function check_updates(){
  if(!confirm(tr('dialog_update_experimental'))){log('用户取消检查更新','WARNING');return;}
  if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  const files=current_files();
  if(!files.length){alert('当前整合包没有模组');return;}
  const mc_ver=$('comboMc').value.trim();
  const loader_api=LOADER_API[$('comboLoaderType').value]||'fabric';
  const mods_to_check=[];
  files.forEach(entry=>{let pid=null;
    if(entry.downloads&&entry.downloads.length)
      pid=parse_project_id_from_url(entry.downloads[0]);
    if(pid)mods_to_check.push({project_id:pid,entry,
      filename:(entry.path||'').split(/[/\\]/).pop()});});
  if(!mods_to_check.length){log('没有可检查的模组（缺少 project_id）','WARNING');
    alert('没有模组包含有效的 Modrinth 项目 ID');return;}
  log(tr('log_update_start'));set_status(tr('status_checking'));
  const total=mods_to_check.length;let done=0;const updates=[];
  (async()=>{await Promise.all(mods_to_check.map(async m=>{
    const result=await check_single_mod(m,mc_ver,loader_api);
    done++;set_status(`${tr('status_checking')}... ${done}/${total}`);
    if(result)updates.push(result);}));
    on_check_done(updates);})();}
async function check_single_mod(m,mc_ver,loader_api){
  try{const latest=await api_get_latest_version(m.project_id,mc_ver,loader_api);
    if(!latest)return null;
    const current_ver=extract_version(m.filename);
    const latest_ver=latest.version_number||'';
    if(current_ver==='未知版本'||!latest_ver)return null;
    const current_url=(m.entry.downloads||[''])[0];
    let latest_url='';
    if(latest.files&&latest.files.length)latest_url=latest.files[0].url||'';
    if(current_url&&latest_url&&current_url===latest_url)return null;
    if(compare_simple(latest_ver,current_ver)>0){
      const name=await api_fetch_project_name(m.project_id);
      return{project_id:m.project_id,name,
        current_ver:normalize_version(current_ver),
        latest_ver:normalize_version(latest_ver),
        current_entry:m.entry,latest_data:latest};}
  }catch{}
  return null;}
function on_check_done(updates){set_status(tr('status_ready'));
  if(!updates.length){alert(tr('dialog_no_update'));
    log(tr('log_update_done'),'SUCCESS');return;}
  show_update_dialog(updates);}

    const rows=[];
    updates.forEach(upd=>{const row=document.createElement('div');row.className='sel-row';
      row._upd=upd;row._selected=false;
      [upd.name,upd.current_ver,upd.latest_ver,''].forEach((val,i)=>{
        const c=document.createElement('div');c.style.width=col_widths[i]+'px';
        c.style.textAlign=i<3?'left':'center';c.textContent=val;
        c.onclick=()=>toggle(row);row.appendChild(c);});
      row.onclick=()=>toggle(row);
      win.bd.appendChild(row);rows.push(row);});
    refresh_count();});}

/* ---------- 打包 .mrpack（照抄 pack_to_mrpack + _continue_pack） ---------- */
function pick_overrides(){return new Promise(res=>{
  const inp=$('fileOverrides');
  inp.onchange=()=>{const files=[...inp.files].map(f=>
    [f,f.webkitRelativePath?f.webkitRelativePath.split('/').slice(1).join('/'):f.name]);
    inp.value='';res(files);};
  inp.oncancel=()=>{inp.value='';res(null);};
  inp.click();});}
async function pack_to_mrpack(){
  if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  save_index_to_state();
  const data=JSON.parse(JSON.stringify(INDEX_DATA));
  if(!(data.files||[]).length){
    if(!confirm(tr('dialog_pack_empty')))return;}
  log('开始打包为 .mrpack...');set_status(tr('status_loading'));
  try{
    let pack_data=data;const extra={};
    if(OFFLINE){
      log('离线模式：开始下载所有模组文件...');
      set_status(tr('status_downloading'));
      const files_list=data.files||[];const total=files_list.length;
      let fail=0;const downloaded=[];
      for(let i=0;i<total;i++){const entry=files_list[i];
        const filename=(entry.path||'').split(/[/\\]/).pop();
        const url=(entry.downloads||[])[0]||'';
        if(!url){log(`跳过 ${filename}（无下载链接）`,'WARNING');continue;}
        set_status(`${tr('status_downloading')} ${i+1}/${total}`);
        log(trf('log_download_progress',{filename,current:i+1,total}));
        try{const r=await fetch(url);
          if(!r.ok)throw new Error('HTTP '+r.status);
          const buf=await r.arrayBuffer();
          if(entry.hashes&&entry.hashes.sha1){
            const s1=await sha1_hex(buf);
            if(s1!==entry.hashes.sha1)throw new Error('SHA1 mismatch');}
          downloaded.push({filename,buf});
          log(trf('log_download_done',{filename}),'SUCCESS');
        }catch(e){fail++;
          log(trf('log_download_fail',{filename,error:e.message}),'ERROR');}}
      if(fail===0){pack_data={...data,files:[]};
        log(trf('log_offline_removed',{count:total}));
        for(const d of downloaded)extra[`mods/${d.filename}`]=d.buf;
        log('已添加 mods 目录','SUCCESS');}
      else{alert(`下载失败\n有 ${fail} 个模组下载失败，index 未作修改，请检查网络后重试。`);
        log('离线打包中止，部分模组下载失败，index 保持不变','WARNING');
        set_status(tr('status_ready'));return;}}
    else{
      // 在线打包：把内存中的本地 JAR 放进 mods/
      if(window._localJars&&window._localJars.size){
        for(const [name,file] of window._localJars)extra[`mods/${name}`]=file;
        log('已添加 mods 目录','SUCCESS');}}
    // 保存路径（对应 asksaveasfilename）
    let handle=null;
    const suggested=`${pack_data.name||'modpack'}.mrpack`;
    if(window.showSaveFilePicker){
      try{handle=await window.showSaveFilePicker({suggestedName:suggested,
        types:[{description:'Modrinth Modpack',accept:{'application/octet-stream':['.mrpack']}}]});}
      catch{set_status(tr('status_ready'));return;}}
    const name=handle?handle.name:suggested;
    // overrides（对应 askyesno + askdirectory）
    const include_overrides=confirm(`${tr('dialog_confirm_overrides')}\n\n${tr('dialog_overrides_prompt')}`);
    let overrides_files=null;
    if(include_overrides){
      overrides_files=await pick_overrides();
      if(!overrides_files)log(tr('log_no_overrides'),'WARNING');}
    const zip=new JSZip();
    zip.file('modrinth.index.json',JSON.stringify(pack_data,null,2));
    for(const[p,c]of Object.entries(extra))zip.file(p,c);
    if(overrides_files)for(const[f,rel]of overrides_files)zip.file(`overrides/${rel}`,f);
    if(overrides_files)log(`已添加 overrides`,'SUCCESS');
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    if(handle){const w=await handle.createWritable();await w.write(blob);await w.close();}
    else dl_blob(blob,name);
    log(trf('log_pack',{path:name}),'SUCCESS');
    set_status(tr('status_packed'));
    alert(`打包完成\n${trf('dialog_pack_success',{path:name})}`);
  }catch(e){log(trf('dialog_pack_fail',{error:e.message}),'ERROR');
    alert(trf('dialog_pack_fail',{error:e.message}));set_status(tr('status_ready'));}}

/* ---------- 通用窗口助手（对应 _win） ---------- */
function build_win(title,w,h,onbuild){
  const ov=document.createElement('div');ov.className='win-ov';
  const win=document.createElement('div');win.className='win';
  win.style.width=w;win.style.height=h;win.style.maxWidth='95vw';win.style.maxHeight='92vh';
  const hd=document.createElement('div');hd.className='win-hd';
  const tt=document.createElement('span');tt.textContent=title;
  const x=document.createElement('button');x.className='x';x.textContent='✕';x.onclick=close_win;
  hd.append(tt,x);
  const bd=document.createElement('div');bd.className='win-bd';
  const ft=document.createElement('div');ft.className='win-ft';
  win.append(hd,bd,ft);ov.appendChild(win);document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add('show'));
  ov._win={title:tt,bd,ft};
  onbuild({title:tt,bd,ft});
  ov.addEventListener('click',e=>{if(e.target===ov)close_win();});}
function close_win(){const ovs=document.querySelectorAll('.win-ov');
  if(ovs.length){ovs[ovs.length-1].remove();}}
function mkbtn(text,cls,width,onclick){const b=document.createElement('button');
  b.className=cls;b.style.width=width;b.textContent=text;b.onclick=onclick;return b;}
