<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 整合包模组管理工具 · Modrinth</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* ===== CSS 变量（主题） ===== */
        :root {
            --bg: #1a1a2e;
            --bg2: #16213e;
            --bg3: #0f3460;
            --fg: #e0e0e0;
            --fg2: #a0aec0;
            --accent: #00d4ff;
            --accent2: #7c3aed;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --card: #1e293b;
            --input_bg: #0f172a;
            --radius: 8px;
            --font: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            --log-bg: #0d1117;
            --log-fg: #e6edf3;
        }
        body.light {
            --bg: #f0f4f8;
            --bg2: #e2e8f0;
            --bg3: #cbd5e1;
            --fg: #1e293b;
            --fg2: #475569;
            --accent: #2563eb;
            --accent2: #7c3aed;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --card: #ffffff;
            --input_bg: #f8fafc;
            --log-bg: #f8fafc;
            --log-fg: #1e293b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--fg);
            padding: 12px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .header {
            background: var(--bg2);
            padding: 12px 20px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 20px;
            color: var(--accent);
            margin-right: 8px;
        }
        .header .sub {
            color: var(--fg2);
            font-size: 13px;
            margin-right: auto;
        }
        .header .toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .header button {
            background: var(--bg3);
            color: var(--fg);
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
            font-family: var(--font);
            transition: 0.2s;
        }
        .header button:hover {
            opacity: 0.8;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 12px;
            flex: 1;
            min-height: 500px;
        }
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
        }
        .panel {
            background: var(--bg2);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .panel-title {
            font-weight: bold;
            color: var(--accent);
            border-bottom: 1px solid var(--bg3);
            padding-bottom: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        input, select, button {
            font-family: var(--font);
            font-size: 12px;
            background: var(--input_bg);
            color: var(--fg);
            border: 1px solid var(--bg3);
            border-radius: 4px;
            padding: 4px 8px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--accent);
        }
        button {
            background: var(--bg3);
            color: white;
            border: none;
            cursor: pointer;
            padding: 4px 12px;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.2s;
        }
        button:hover { opacity: 0.85; }
        button.primary { background: var(--accent); color: #000; }
        button.success { background: var(--success); }
        button.danger { background: var(--danger); }
        button.warning { background: var(--warning); }
        button.accent2 { background: var(--accent2); }
        .table-wrap {
            flex: 1;
            overflow: auto;
            border: 1px solid var(--bg3);
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        th {
            background: var(--bg3);
            color: var(--accent);
            text-align: left;
            padding: 6px 8px;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        td {
            padding: 4px 8px;
            border-bottom: 1px solid var(--bg3);
            vertical-align: middle;
        }
        tr:hover td {
            background: var(--card);
        }
        .search-box {
            flex: 1;
            min-width: 120px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 6px 10px;
            align-items: center;
        }
        .info-grid label {
            color: var(--fg2);
            font-size: 12px;
        }
        .info-grid input, .info-grid select {
            width: 100%;
        }
        .compat-label {
            font-size: 12px;
            font-weight: bold;
        }
        .log-box {
            background: var(--log-bg);
            border-radius: 4px;
            padding: 8px;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            color: var(--log-fg);
            transition: background 0.3s, color 0.3s;
        }
        .log-box .time {
            color: var(--fg2);
        }
        .log-box .ok {
            color: var(--success);
        }
        .log-box .err {
            color: var(--danger);
        }
        .log-box .warn {
            color: var(--warning);
        }
        .status-bar {
            background: var(--bg2);
            padding: 4px 12px;
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 12px;
        }
        .status-bar .status-text {
            color: var(--fg2);
        }
        .offline-indicator {
            color: var(--accent);
            font-weight: bold;
        }
        .truncate {
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
            vertical-align: middle;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--bg2);
            border-radius: var(--radius);
            padding: 16px;
            max-width: 860px;
            width: 95%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .modal-body {
            flex: 1;
            overflow: auto;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--bg3);
        }
        .version-table th {
            position: sticky;
            top: 0;
            background: var(--bg3);
        }
        .version-table td {
            padding: 4px 8px;
        }
        .version-table tr {
            cursor: pointer;
        }
        .version-table tr.selected {
            background: var(--accent);
            color: #000;
        }
        .text-center { text-align: center; }
        .text-sm { font-size: 12px; }
        .footer {
            text-align: center;
            padding: 6px 0;
            color: var(--fg2);
            font-size: 11px;
            border-top: 1px solid var(--bg3);
            margin-top: 6px;
        }
        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .offline-badge {
            display: none;
            background: var(--accent);
            color: #000;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .offline-badge.active {
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <!-- Header -->
    <header class="header">
        <h1 id="title">⚡ 整合包模组管理工具</h1>
        <span class="sub" id="sub">Modrinth · 精简高效</span>
        <span style="flex:1"></span>
        <div class="toolbar">
            <button id="themeBtn">🎨 切换主题</button>
            <button id="langBtn">🌐 切换语言</button>
            <button id="offlineBtn">📥 离线模式</button>
        </div>
        <span class="offline-badge" id="offlineBadge">离线</span>
    </header>

    <!-- Main -->
    <div class="main-grid">
        <div class="panel">
            <div class="panel-title" id="fileLabel">📁 文件</div>
            <div class="row">
                <label id="pathLabel">路径:</label>
                <input id="filePath" type="text" style="flex:1; min-width:120px;" readonly>
                <button id="browseBtn" class="primary">浏览</button>
                <button id="openMrpackBtn" class="accent2">打开 .mrpack</button>
                <input type="file" id="fileInput" accept=".json" style="display:none">
                <input type="file" id="mrpackInput" accept=".mrpack,.zip" style="display:none">
            </div>
            <div id="modeHint" style="color:var(--accent); font-size:12px; font-style:italic;">当前模式：打开已有文件</div>

            <div class="panel-title" id="infoLabel">📋 整合包信息</div>
            <button id="toggleInfoBtn" style="align-self:flex-start; padding:2px 8px;">▶ 展开</button>
            <div id="infoContent" style="display:none;">
                <div class="info-grid">
                    <label id="infoName">名称:</label>
                    <input id="pkgName" value="我的整合包">
                    <label id="infoVersion">版本:</label>
                    <input id="pkgVersion" value="1.0.0">
                    <label id="infoMc">MC版本:</label>
                    <input id="pkgMc" value="1.20.1">
                    <label id="infoLoader">加载器:</label>
                    <select id="pkgLoader">
                        <option value="Fabric">Fabric</option>
                        <option value="Forge">Forge</option>
                        <option value="NeoForge">NeoForge</option>
                    </select>
                    <label id="infoLoaderVer">加载器版本:</label>
                    <input id="pkgLoaderVer" value="0.15.11">
                    <span></span>
                    <span class="compat-label" id="compatLabel"></span>
                </div>
                <div class="row">
                    <button id="downloadIndexBtn" class="success">⬇ 下载 index.json</button>
                    <button id="reloadMetaBtn" class="warning">🔄 重新加载</button>
                </div>
            </div>

            <div class="panel-title" id="addModLabel">➕ 添加模组</div>
            <div class="row">
                <input id="modInput" placeholder="项目链接或 ID" style="flex:1; min-width:120px;">
                <button id="fetchBtn" class="accent2">🔍 获取版本</button>
            </div>

            <div class="panel-title" id="modListLabel">📦 模组列表</div>
            <div class="row">
                <input id="searchInput" class="search-box" placeholder="🔍 搜索模组...">
                <button id="refreshBtn" class="primary">🔄 刷新</button>
                <button id="deleteBtn" class="danger">🗑️ 删除</button>
                <button id="folderBtn" class="warning">📂 打开文件夹</button>
                <button id="checkUpdateBtn" class="warning">🧪 检查更新（实验性）</button>
                <button id="verifyBtn" class="primary">🔧 校验与修复</button>
            </div>
            <div class="table-wrap">
                <table id="modTable">
                    <thead>
                        <tr>
                            <th style="width:30px;"><input type="checkbox" id="selectAll"></th>
                            <th id="colName">项目名称</th>
                            <th id="colFilename">文件名</th>
                            <th id="colVersion">版本</th>
                            <th id="colPath">路径</th>
                        </tr>
                    </thead>
                    <tbody id="modTableBody">
                        <tr><td colspan="5" class="text-center text-sm" style="color:var(--fg2);" id="noModsMsg">暂无模组，请打开或添加</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="row">
                <button id="backupBtn" class="warning">💾 备份</button>
                <button id="packBtn" class="success">📦 打包 .mrpack</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title" id="logLabel">📋 日志</div>
            <div class="log-box" id="logBox"></div>
        </div>
    </div>

    <div class="status-bar">
        <span class="status-text" id="statusText">就绪 ✅</span>
        <span class="offline-indicator" id="offlineStatus"></span>
        <span id="themeStatus" style="color:var(--fg2); font-size:11px;"></span>
    </div>

    <div class="footer">
        <a href="https://github.com/Mace778/modpack-wizard" target="_blank" rel="noopener">📦 查看源码 · GitHub</a>
    </div>
</div>

<!-- Modal: 版本选择 -->
<div class="modal-overlay" id="versionModal">
    <div class="modal">
        <div class="modal-title" id="modalTitle">选择版本</div>
        <div class="modal-body">
            <table class="version-table" id="versionTable">
                <thead><tr><th>版本号</th><th>游戏版本</th><th>加载器</th><th>发布日期</th><th>推荐</th></tr></thead>
                <tbody id="versionTableBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button id="modalSelectBtn" class="success">选择此版本</button>
            <button id="modalToggleBtn" class="accent2">🔄 显示全部</button>
            <button id="modalCloseBtn">取消</button>
        </div>
    </div>
</div>

<!-- Modal: 更新 -->
<div class="modal-overlay" id="updateModal">
    <div class="modal">
        <div class="modal-title" id="updateTitle">🧪 检查更新（实验性）</div>
        <div class="modal-body">
            <p id="updateWarning" style="color: var(--warning); margin-bottom: 8px; font-size:12px;">⚠️ 该功能为实验性，版本比较可能不准确，请以 Modrinth 页面为准。</p>
            <table id="updateTable">
                <thead><tr>
                    <th style="width:30px;"><input type="checkbox" id="updateSelectAll"></th>
                    <th>模组名称</th><th>当前版本</th><th>最新版本</th>
                </tr></thead>
                <tbody id="updateTableBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button id="updateApplyBtn" class="success">更新选中</button>
            <button id="updateCloseBtn">关闭</button>
        </div>
    </div>
</div>

        // ===== 工具函数 =====
        function extractVersion(filename) {
            if (!filename) return '未知版本';
            let text = filename;
            if (text.includes('+')) text = text.split('+')[0];
            text = text.replace(/-(?:fabric|forge|neoforge|universal|modern|mc\d+(?:\.\d+)?)(?:-[a-zA-Z0-9.]+)?$/, '');
            text = text.replace(/[+-]mc\d+(?:\.\d+)?/, '');
            const matches = text.match(/\b(\d+(?:\.\d+)+)\b/g);
            if (!matches) return '未知版本';
            matches.sort((a,b) => b.split('.').length - a.split('.').length || b.localeCompare(a));
            return matches[0];
        }

        function parseProjectId(url) {
            const m = url.match(/modrinth\.com\/(?:mod|project)\/([a-zA-Z0-9_-]+)/);
            if (m) return m[1];
            if (/^[a-zA-Z0-9_-]+$/.test(url)) return url;
            return null;
        }

        function parseProjectIdFromUrl(url) {
            const m = url.match(/cdn\.modrinth\.com\/data\/([^/]+)\//);
            return m ? m[1] : null;
        }

        function compareVersions(v1, v2) {
            const parse = v => v.split('.').map(s => parseInt(s.replace(/[^0-9]/g,'')) || 0);
            const a = parse(v1), b = parse(v2);
            const len = Math.max(a.length, b.length);
            for (let i=0; i<len; i++) {
                const n1 = a[i] || 0, n2 = b[i] || 0;
                if (n1 !== n2) return n1 - n2;
            }
            return 0;
        }

        function getTimestamp() {
            const now = new Date();
            return now.getFullYear() +
                String(now.getMonth()+1).padStart(2,'0') +
                String(now.getDate()).padStart(2,'0') + '_' +
                String(now.getHours()).padStart(2,'0') +
                String(now.getMinutes()).padStart(2,'0') +
                String(now.getSeconds()).padStart(2,'0');
        }

        // ===== 日志 =====
        function log(msg, type='info') {
            const time = new Date().toLocaleTimeString();
            const prefix = type==='error' ? '❌' : type==='success' ? '✅' : type==='warn' ? '⚠️' : 'ℹ️';
            const cls = type==='error' ? 'err' : type==='success' ? 'ok' : type==='warn' ? 'warn' : '';
            logBox.innerHTML += `<div><span class="time">[${time}]</span> <span class="${cls}">${prefix} ${msg}</span></div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setStatus(msg) {
            statusText.textContent = msg;
        }

        // ===== API =====
        async function fetchJSON(url) {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return resp.json();
        }

        async function getProjectName(projectId) {
            try {
                const data = await fetchJSON(`https://api.modrinth.com/v2/project/${projectId}`);
                return data.title || projectId;
            } catch { return projectId; }
        }

        async function getVersions(projectId, mcVer, loaderApi) {
            const url = `https://api.modrinth.com/v2/project/${projectId}/version?limit=100`;
            const all = await fetchJSON(url);
            all.sort((a,b) => new Date(b.date_published) - new Date(a.date_published));
            if (mcVer && loaderApi) {
                const compatible = all.filter(v =>
                    v.game_versions.includes(mcVer) &&
                    (!v.loaders || v.loaders.includes(loaderApi))
                );
                return compatible.length ? compatible : all;
            }
            return all;
        }

        async function getLatestVersion(projectId, mcVer, loaderApi) {
            const url = `https://api.modrinth.com/v2/project/${projectId}/version?game_versions=["${mcVer}"]&loaders=["${loaderApi}"]&limit=1`;
            try {
                const data = await fetchJSON(url);
                return data.length ? data[0] : null;
            } catch { return null; }
        }

        // ===== 数据操作 =====
        function gatherData() {
            if (!currentData) {
                currentData = {
                    game: 'minecraft',
                    formatVersion: 1,
                    versionId: '1.0.0',
                    name: '我的整合包',
                    summary: '',
                    files: [],
                    dependencies: {}
                };
            }
            const d = currentData;
            d.name = pkgName.value.trim() || '未命名';
            d.versionId = pkgVersion.value.trim() || '1.0.0';
            const deps = d.dependencies || {};
            deps.minecraft = pkgMc.value.trim() || '1.20.1';
            const loaderKey = { 'Fabric':'fabric-loader', 'Forge':'forge', 'NeoForge':'neoforge' }[pkgLoader.value] || 'fabric-loader';
            deps[loaderKey] = pkgLoaderVer.value.trim() || '0.15.11';
            d.dependencies = deps;
            return d;
        }

        function loadData(data) {
            currentData = data;
            pkgName.value = data.name || '未命名';
            pkgVersion.value = data.versionId || '1.0.0';
            const deps = data.dependencies || {};
            pkgMc.value = deps.minecraft || '1.20.1';
            let loaderKey = null, loaderVer = '';
            for (const key of ['fabric-loader','forge','neoforge']) {
                if (deps[key] !== undefined) { loaderKey = key; loaderVer = deps[key]; break; }
            }
            if (!loaderKey) {
                for (const key of ['fabric-loader','forge','neoforge']) {
                    if (data[key] !== undefined) { loaderKey = key; loaderVer = data[key]; break; }
                }
            }
            const loaderName = { 'forge':'Forge', 'neoforge':'NeoForge' }[loaderKey] || 'Fabric';
            pkgLoader.value = loaderName;
            pkgLoaderVer.value = loaderVer || '';
            refreshModList();
            updateCompatibility();
            log(t('logLoadMods').replace('{count}', (data.files||[]).length), 'success');
            setStatus(t('statusReady'));
        }

        // ===== 模组列表 =====
        function refreshModList() {
            const data = gatherData();
            const files = data.files || [];
            allMods = files.map(entry => {
                const path = entry.path || '';
                const filename = path.split('/').pop() || '';
                const version = extractVersion(filename);
                let project_id = null;
                if (entry.downloads && entry.downloads.length) {
                    const pid = parseProjectIdFromUrl(entry.downloads[0]);
                    if (pid) project_id = pid;
                }
                const display_name = project_id ? project_id : filename;
                return { path, filename, version, display_name, project_id, raw_entry: entry };
            });
            allMods.forEach(async (mod) => {
                if (mod.project_id) {
                    const name = await getProjectName(mod.project_id);
                    if (name && name !== mod.display_name) {
                        mod.display_name = name;
                        renderTable();
                    }
                }
            });
            renderTable();
        }

        function renderTable() {
            const keyword = searchInput.value.trim().toLowerCase();
            let filtered = allMods;
            if (keyword) {
                filtered = allMods.filter(e =>
                    e.display_name.toLowerCase().includes(keyword) ||
                    e.filename.toLowerCase().includes(keyword) ||
                    e.path.toLowerCase().includes(keyword)
                );
            }
            const tbody = modTableBody;
            tbody.innerHTML = '';
            if (!filtered.length) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-sm" style="color:var(--fg2);">${t('noModsMsg')}</td></tr>`;
                return;
            }
            filtered.forEach((mod, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="checkbox" class="mod-checkbox" data-index="${index}"></td>
                    <td class="truncate" title="${mod.display_name}">${mod.display_name}</td>
                    <td class="truncate" title="${mod.filename}">${mod.filename}</td>
                    <td>${mod.version}</td>
                    <td class="truncate" title="${mod.path}">${mod.path}</td>
                `;
                tbody.appendChild(tr);
            });
            selectAll.checked = false;
        }

        // ===== 兼容性 =====
        function updateCompatibility() {
            if (pkgLoader.value !== 'Fabric') {
                compatLabel.textContent = '';
                return;

            const mc = pkgMc.value.trim(), fab = pkgLoaderVer.value.trim();
            if (!mc || !fab) {

        // ===== 添加模组 =====
        async function fetchVersions() {
            const input = modInput.value.trim();
            if (!input) { alert(t('dialogSelectMod')); return; }
            const projectId = parseProjectId(input);
            if (!projectId) { alert('无法解析项目 ID'); return; }
            setStatus(t('statusLoading'));
            log(`获取项目 ${projectId} 的版本...`);
            try {
                const mc = pkgMc.value.trim();
                const loaderApi = { 'Fabric':'fabric', 'Forge':'forge', 'NeoForge':'neoforge' }[pkgLoader.value] || 'fabric';
                const versions = await getVersions(projectId, mc, loaderApi);
                if (!versions.length) { alert(t('dialogNoVersion')); setStatus(t('statusReady')); return; }
                allVersionsCache = versions;
                let defaultDisplay = versions.filter(v => v.featured);
                if (!defaultDisplay.length) defaultDisplay = versions.slice(0, 20);
                modalMode = 'default';
                showVersionModal(projectId, versions, defaultDisplay);
                setStatus(t('statusReady'));
            } catch (e) {
                log(t('dialogVersionFetch').replace('{error}', e.message), 'error');
                alert(t('dialogVersionFetch').replace('{error}', e.message));
                setStatus(t('statusReady'));
            }
        }

        function showVersionModal(projectId, allVersions, displayList) {
            const modal = versionModal;
            modalTitle.textContent = `${t('selectVersion')} - ${projectId} (${displayList.length})`;
            const tbody = versionTableBody;
            tbody.innerHTML = '';
            displayList.forEach(v => {
                const tr = document.createElement('tr');
                tr.dataset.version = v.version_number;
                tr.innerHTML = `
                    <td>${v.version_number}</td>
                    <td>${v.game_versions.join(', ')}</td>
                    <td>${v.loaders ? v.loaders.join(', ') : ''}</td>
                    <td>${v.date_published.slice(0,10)}</td>
                    <td>${v.featured ? '⭐' : ''}</td>
                `;
                tr.addEventListener('click', function() {
                    tbody.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
                    this.classList.add('selected');
                });
                tbody.appendChild(tr);
            });
            window._allVersions = allVersions;
            modal.classList.add('active');

            modalSelectBtn.onclick = function() {
                const selected = tbody.querySelector('tr.selected');
                if (!selected) { alert(t('dialogSelectVersion')); return; }
                const ver = selected.dataset.version;
                const matched = allVersions.find(v => v.version_number === ver);
                if (matched) { addVersion(matched); modal.classList.remove('active'); }
                else alert('数据异常');
            };
            modalToggleBtn.onclick = function() {
                const all = window._allVersions;
                if (modalMode === 'default') {
                    showVersionModal(projectId, all, all);
                    modalMode = 'all';
                    modalToggleBtn.textContent = t('showRecommended');
                } else {
                    const mc = pkgMc.value.trim();
                    const loaderApi = { 'Fabric':'fabric', 'Forge':'forge', 'NeoForge':'neoforge' }[pkgLoader.value] || 'fabric';
                    let compatible = all.filter(v =>
                        v.game_versions.includes(mc) &&
                        (!v.loaders || v.loaders.includes(loaderApi))
                    );
                    const defaultDisplay = compatible.filter(v => v.featured) || compatible;
                    showVersionModal(projectId, all, defaultDisplay);
                    modalMode = 'default';
                    modalToggleBtn.textContent = t('showAll');
                }
            };
            modalCloseBtn.onclick = () => modal.classList.remove('active');
            modal.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
        }

        function addVersion(versionData) {
            const fileObj = versionData.files[0];
            if (!fileObj) { alert('版本文件缺失'); return; }
            const filename = fileObj.filename;
            const entry = {
                path: `mods/${filename}`,
                hashes: { sha1: fileObj.hashes.sha1, sha512: fileObj.hashes.sha512 },
                downloads: [fileObj.url],
                fileSize: fileObj.size
            };
            const data = gatherData();
            const files = data.files || [];
            if (files.some(f => f.path === entry.path)) {
                if (!confirm(t('dialogVersionExists').replace('{filename}', filename))) {
                    log(t('logAddMod').replace('{filename}', filename) + ' (已存在，取消)', 'warn');
                    return;
                }
            }
            files.push(entry);
            data.files = files;
            currentData = data;
            refreshModList();
            const deps = versionData.dependencies || [];
            const depIds = deps.filter(d => d.project_id).map(d => d.project_id);
            if (depIds.length) {
                const msg = t('dialogDepPrompt').replace('{filename}', filename).replace('{ids}', depIds.join('\n'));
                if (confirm(msg + '\n\n' + t('dialogOpenDepPage'))) {
                    depIds.forEach(id => window.open(`https://modrinth.com/mod/${id}`, '_blank'));
                }
            }
            if (offlineMode) {
                offlineLinks.push(`${filename}: ${fileObj.url}`);
                log(`离线模式：请手动下载 ${filename} 从 ${fileObj.url}`);
                if (confirm(t('dialogOfflineExport'))) {
                    exportOfflineLinks();
                }
            }
            log(t('logAddMod').replace('{filename}', filename), 'success');
            setStatus(t('statusReady'));
        }

        function exportOfflineLinks() {
            if (!offlineLinks.length) {
                alert('没有离线下载链接');
                return;
            }
            const links = offlineLinks.join('\n');
            const blob = new Blob([links], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'offline_links.txt';
            a.click();
            URL.revokeObjectURL(url);
            log('离线链接已导出', 'success');
        }

        // ===== 删除 =====
        function deleteSelected() {
            const checked = document.querySelectorAll('.mod-checkbox:checked');
            if (!checked.length) { alert(t('dialogSelectMod')); return; }
            if (!confirm(t('dialogConfirmDelete').replace('{count}', checked.length))) return;
            const indices = Array.from(checked).map(cb => parseInt(cb.dataset.index));
            const data = gatherData();
            const files = data.files || [];
            const toDeletePaths = indices.map(i => allMods[i].path);
            data.files = files.filter(f => !toDeletePaths.includes(f.path));
            currentData = data;
            refreshModList();
            log(t('logDeleteMod').replace('{count}', checked.length), 'success');
        }

        // ===== 校验与修复 =====
        async function verifyAndFix() {
            if (!currentData) { alert(t('dialogFileNotFound')); return; }
            log(t('logVerifyStart'));
            const data = gatherData();
            const files = data.files || [];
            const total = files.length;
            let invalid = 0;
            files.forEach(entry => {
                if (!entry.path || !entry.downloads) invalid++;
            });
            const msg = t('logVerifyDone').replace('{total}', total).replace('{missing}', 'N/A').replace('{invalid}', invalid);
            log(msg);
            if (invalid > 0) {
                if (confirm(t('dialogVerifyMsg').replace('{missing}', 'N/A').replace('{invalid}', invalid))) {
                    const newFiles = files.filter(f => f.path && f.downloads);
                    data.files = newFiles;
                    currentData = data;
                    refreshModList();
                    log(t('logVerifyFixed').replace('{count}', total - newFiles.length), 'success');
                    alert(t('dialogVerifyFixMsg').replace('{count}', total - newFiles.length));
                }
            } else {
                alert(t('dialogVerifyPassMsg'));
            }
        }

        // ===== 检查更新 =====
        async function checkUpdates() {
            if (!allMods.length) { alert('没有模组可供检查'); return; }
            if (!confirm(t('dialogUpdateExperimental'))) { log('用户取消检查更新', 'warn'); return; }
            setStatus(t('statusLoading'));
            log(t('logUpdateStart'));
            const mcVer = pkgMc.value.trim();
            const loaderApi = { 'Fabric':'fabric', 'Forge':'forge', 'NeoForge':'neoforge' }[pkgLoader.value] || 'fabric';
            const updates = [];
            const queue = allMods.filter(m => m.project_id);
            let completed = 0;
            const total = queue.length;

            const concurrency = 10;
            const workers = [];
            const worker = async () => {
                while (queue.length) {
                    const mod = queue.shift();
                    try {
                        const latest = await getLatestVersion(mod.project_id, mcVer, loaderApi);
                        if (latest) {
                            const latestVer = extractVersion(latest.version_number);
                            const currentVer = mod.version;
                            if (currentVer !== '未知版本' && latestVer !== '未知版本' && compareVersions(latestVer, currentVer) > 0) {
                                const name = await getProjectName(mod.project_id);
                                updates.push({
                                    mod,
                                    name,
                                    currentVer,
                                    latestVer,
                                    latestData: latest
                                });
                            }
                        }
                    } catch (e) {}
                    completed++;
                    setStatus(`${t('statusLoading')}... ${completed}/${total}`);
                }
            };
            for (let i=0; i<Math.min(concurrency, total); i++) workers.push(worker());
            await Promise.all(workers);

            setStatus(t('statusReady'));
            if (!updates.length) {
                alert(t('dialogNoUpdate'));
                log(t('logUpdateDone'), 'success');
                return;
            }
            showUpdateDialog(updates);
        }

        function showUpdateDialog(updates) {
            const tbody = updateTableBody;
            tbody.innerHTML = '';
            updates.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="checkbox" class="update-checkbox" data-index="${idx}"></td>
                    <td>${item.name}</td>
                    <td>${item.currentVer}</td>
                    <td>${item.latestVer}</td>
                `;
                tbody.appendChild(tr);
            });
            updateSelectAll.checked = false;
            updateModal.classList.add('active');

            updateSelectAll.onchange = function() {
                tbody.querySelectorAll('.update-checkbox').forEach(cb => cb.checked = this.checked);
            };

            updateApplyBtn.onclick = function() {
                const checked = tbody.querySelectorAll('.update-checkbox:checked');
                if (!checked.length) { alert(t('dialogUpdateSelect')); return; }
                if (!confirm(t('dialogUpdateApply').replace('{count}', checked.length))) return;
                const indices = Array.from(checked).map(cb => parseInt(cb.dataset.index));
                const data = gatherData();
                const files = data.files || [];
                let updated = 0;
                indices.forEach(idx => {
                    const item = updates[idx];
                    const mod = item.mod;
                    const latest = item.latestData;
                    const newEntry = {
                        path: `mods/${latest.files[0].filename}`,
                        hashes: {
                            sha1: latest.files[0].hashes.sha1,
                            sha512: latest.files[0].hashes.sha512
                        },
                        downloads: [latest.files[0].url],
                        fileSize: latest.files[0].size
                    };
                    const fileIndex = files.findIndex(f => f.path === mod.path);
                    if (fileIndex !== -1) {
                        files[fileIndex] = newEntry;
                        updated++;
                    }
                });
                if (!updated) { alert('没有模组被更新（可能路径不匹配）'); return; }
                data.files = files;
                currentData = data;
                refreshModList();
                log(t('logUpdateSuccess').replace('{count}', updated), 'success');
                setStatus(t('statusReady'));
                updateModal.classList.remove('active');
                alert(t('dialogUpdateSuccess').replace('{count}', updated));
            };

            updateCloseBtn.onclick = () => updateModal.classList.remove('active');
            updateModal.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
        }

        // ===== 打包 =====
        async function packMrpack() {
            const data = gatherData();
            if (!data.files || !data.files.length) {
                if (!confirm(t('dialogPackEmpty'))) return;
            }
            try {
                const zip = new JSZip();
                zip.file('modrinth.index.json', JSON.stringify(data, null, 2));
                const blob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${data.name || 'modpack'}.mrpack`;
                a.click();
                URL.revokeObjectURL(url);
                log(t('logPack').replace('{path}', `${data.name}.mrpack`), 'success');
                setStatus(t('statusReady'));
            } catch (e) {
                log(t('dialogPackFail').replace('{error}', e.message), 'error');
                alert(t('dialogPackFail').replace('{error}', e.message));
            }
        }

        // ===== 备份 =====
        function backupIndex() {
            const data = gatherData();
            const filename = `modrinth.index.backup_${getTimestamp()}.json`;
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            log(t('logBackup').replace('{path}', filename), 'success');
            setStatus(t('statusReady'));
        }

        // ===== 文件加载 =====
        function loadFromJSON(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    loadData(data);
                    filePath.value = file.name;
                    log(t('dialogSuccessOpen').replace('{file}', file.name), 'success');
                    setStatus(t('statusReady'));
                } catch (err) {
                    alert(t('dialogParseError').replace('{error}', err.message));
                    log(t('dialogParseError').replace('{error}', err.message), 'error');
                }
            };
            reader.readAsText(file);
        }

        function loadFromMrpack(file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const zip = await JSZip.loadAsync(e.target.result);
                    const indexFile = zip.file('modrinth.index.json');
                    if (!indexFile) {
                        alert(t('dialogOpenMrpackFail'));
                        log(t('dialogOpenMrpackFail'), 'error');
                        return;
                    }
                    const content = await indexFile.async('string');
                    const data = JSON.parse(content);
                    loadData(data);
                    filePath.value = file.name;
                    log(t('dialogSuccessOpen').replace('{file}', file.name), 'success');
                    setStatus(t('statusReady'));
                } catch (err) {
                    alert(t('dialogOpenMrpackFail') + ': ' + err.message);
                    log(t('dialogOpenMrpackFail') + ': ' + err.message, 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ===== 事件绑定 =====
        browseBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', function(e) {
            if (this.files.length) loadFromJSON(this.files[0]);
            this.value = '';
        });

        openMrpackBtn.addEventListener('click', () => mrpackInput.click());
        mrpackInput.addEventListener('change', function(e) {
            if (this.files.length) loadFromMrpack(this.files[0]);
            this.value = '';
        });

        downloadIndexBtn.addEventListener('click', function() {
            const data = gatherData();
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'modrinth.index.json';
            a.click();
            URL.revokeObjectURL(url);
            log('已下载 index.json', 'success');
            setStatus(t('statusReady'));
        });

        reloadMetaBtn.addEventListener('click', function() {
            if (currentData) { loadData(currentData); log('重新加载元数据', 'success'); }
            else alert(t('dialogFileNotFound'));
        });

        fetchBtn.addEventListener('click', fetchVersions);
        modInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') fetchBtn.click();
        });

        searchInput.addEventListener('input', renderTable);

        refreshBtn.addEventListener('click', function() {
            refreshModList();
            updateCompatibility();
        });

        deleteBtn.addEventListener('click', deleteSelected);
        folderBtn.addEventListener('click', function() {
            alert('浏览器无法打开文件夹，请手动浏览到该 index.json 所在目录。');
        });

        checkUpdateBtn.addEventListener('click', checkUpdates);
        verifyBtn.addEventListener('click', verifyAndFix);
        backupBtn.addEventListener('click', backupIndex);
        packBtn.addEventListener('click', packMrpack);

        selectAll.addEventListener('change', function() {
            document.querySelectorAll('.mod-checkbox').forEach(cb => cb.checked = this.checked);
        });

        toggleInfoBtn.addEventListener('click', function() {
            infoExpanded = !infoExpanded;
            infoContent.style.display = infoExpanded ? 'block' : 'none';
            this.textContent = infoExpanded ? t('collapseBtn') : t('expandBtn');
        });

        [pkgName, pkgVersion, pkgMc, pkgLoader, pkgLoaderVer].forEach(el => {
            el.addEventListener('change', function() {
                gatherData();
                updateCompatibility();
                refreshModList();
            });
        });
        pkgLoader.addEventListener('change', updateCompatibility);

        // ===== 主题切换（带状态反馈） =====
        document.getElementById('themeBtn').addEventListener('click', function() {
            theme = theme === 'dark' ? 'light' : 'dark';
            applyTheme();
            savePrefs();
            log(t('logThemeSwitch').replace('{theme}', theme));
            setStatus(t('themeStatus').replace('{theme}', theme));
        });

        // ===== 语言切换（刷新确保完全生效） =====
        document.getElementById('langBtn').addEventListener('click', function() {
            lang = lang === 'zh_CN' ? 'en_US' : 'zh_CN';
            savePrefs();
            alert(t('langSwitchDone'));
            location.reload();
        });

        // ===== 离线模式切换 =====
        document.getElementById('offlineBtn').addEventListener('click', function() {
            offlineMode = !offlineMode;
            const state = offlineMode ? t('offlineOn') : t('offlineOff');
            log(t('logOfflineMode').replace('{state}', state));
            offlineStatus.textContent = offlineMode ? t('offlineOn') : '';
            offlineBadge.classList.toggle('active', offlineMode);
            setStatus(offlineMode ? t('offlineOn') : t('statusReady'));
        });

        // ===== 初始化 =====
        function init() {
            applyTheme();
            logBox.innerHTML = '';
            log(t('logStartup'), 'info');
            setStatus(t('statusReady'));

            const initData = {
                game: 'minecraft',
                formatVersion: 1,
                versionId: '1.0.0',
                name: '我的整合包',
                summary: '',
                files: [],
                dependencies: {}
            };
            loadData(initData);
            updateUIText();

            offlineStatus.textContent = offlineMode ? t('offlineOn') : '';
            offlineBadge.classList.toggle('active', offlineMode);
        }

        init();
    })();
</script>
</body>
</html>
