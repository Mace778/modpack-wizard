<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@fluentui/web-components@3.1.3/+esm" crossorigin>
<link rel="preconnect" href="https://api.modrinth.com" crossorigin>
<style>
/* WinUI 3 Design Tokens - Light */
:root{
--accent:#0078D4;--accent-h:#106EBE;--accent2:#8b5cf6;--accent2-h:#7c3aed;
--success:#16a34a;--warning:#d97706;--danger:#dc2626;
--gray:#e0e0e0;--gray-h:#d0d0d0;
--text-light:#1A1A1A;--text-dark:#fff;
--mica:#F3F3F3;--mica-strong:#FFFFFF;
--header:#e8e8e8;--zebra:#fafafa;--border:#E5E5E5;
--row-hover:#e5efff;--selected:#cce4f7;--text:#1A1A1A;--muted:#5D5D5D;
--radius-ctrl:4px;--radius-card:8px;--ctrl-height:32px;
--font-family:'Segoe UI Variable Text','Microsoft YaHei UI','Segoe UI',system-ui,sans-serif}
/* WinUI 3 Design Tokens - Dark */
[data-theme="dark"]{
--accent:#4CC2FF;--accent-h:#6FD0FF;--accent2:#7d5ba6;--accent2-h:#6b4a8f;
--success:#3a8a3a;--warning:#b08a2a;--danger:#b8383d;
--gray:#2a2a2a;--gray-h:#3d3d3d;
--text-light:#e5e5e5;--text-dark:#fff;
--mica:#202020;--mica-strong:#2B2B2B;
--header:#1a1a1a;--zebra:#1f1f1f;--border:#3D3D3D;
--row-hover:#232c3a;--selected:#294058;--text:#FFFFFF;--muted:#C5C5C5}
/* Fluent Web Components 主题变量映射（WinUI 3） */
:root{
--fill-color-default:var(--mica-strong);
--fill-color-primary:var(--accent);
--fill-color-secondary:var(--gray);
--fill-color-text-primary:var(--text);
--fill-color-text-secondary:var(--muted);
--accent-fill-rest:var(--accent);--accent-fill-hover:var(--accent-h);
--accent-fill-active:var(--accent);--accent-fill-focus:var(--accent);
--accent-foreground-rest:#fff;--accent-foreground-hover:#fff;
--neutral-fill-rest:var(--gray);--neutral-fill-hover:var(--gray-h);
--neutral-fill-active:var(--gray-h);--neutral-fill-focus:var(--gray);
--neutral-foreground-rest:var(--text);--neutral-foreground-hover:var(--text);
--neutral-divider-rest:var(--border);
--control-corner-radius:var(--radius-ctrl);--control-height:var(--ctrl-height);
--font-size-base-100:13px;--font-size-base-200:14px;
--font-family-base:var(--font-family)}
[data-theme="dark"]{
--fill-color-default:var(--mica-strong);
--fill-color-primary:var(--accent);
--fill-color-secondary:var(--gray);
--fill-color-text-primary:var(--text);
--fill-color-text-secondary:var(--muted);
--accent-fill-rest:var(--accent);--accent-fill-hover:var(--accent-h);
--accent-fill-active:var(--accent);--accent-fill-focus:var(--accent);
--accent-foreground-rest:#1a1a1a;--accent-foreground-hover:#1a1a1a;
--neutral-fill-rest:var(--gray);--neutral-fill-hover:var(--gray-h);
--neutral-fill-active:var(--gray-h);--neutral-fill-focus:var(--gray);
--neutral-foreground-rest:var(--text);--neutral-foreground-hover:var(--text);
--neutral-divider-rest:var(--border)}
/* ===== 风格维度：classic / winui（与明暗正交，共 4 套） ===== */
/* 经典浅色：更圆的圆角、更浅的背景、Segoe UI 字体 */
[data-style="classic"]{
--accent:#0078d4;--accent-h:#106ebe;
--mica:#fafbfc;--mica-strong:#f0f2f5;
--border:#d0d0d0;--text:#1a1a1a;--muted:#6b7280;
--header:#e8e8e8;--zebra:#f4f4f4;--row-hover:#eef2f7;--selected:#d6e4f5;
--radius-ctrl:8px;--radius-card:12px;
--font-family:'Segoe UI',system-ui,sans-serif}
/* 经典深色 */
[data-style="classic"][data-theme="dark"]{
--accent:#2d7dd2;--accent-h:#2a6cb0;
--mica:#252525;--mica-strong:#2d2d2d;
--border:#3a3a3a;--text:#e5e5e5;--muted:#9ca3af;
--header:#1f1f1f;--zebra:#2a2a2a;--row-hover:#30343a;--selected:#33465c}
/* winui 风格与 :root 默认 token 完全一致，无需再声明；仅 WinUI 专属的焦点环与微动效在此 */
[data-style="winui"] button:focus-visible,
[data-style="winui"] input:focus-visible,
[data-style="winui"] select:focus-visible{
outline:2px solid var(--accent);outline-offset:1px}
[data-style="winui"] button{transition:background .12s,transform .06s}
[data-style="winui"] button:active{transform:scale(.98)}
*{margin:0;padding:0;box-sizing:border-box}
body{font:13px var(--font-family);background:var(--mica);color:var(--text);
height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* Fluent Button Base */
button,.btn{font:12px var(--font-family);cursor:pointer;border:none;border-radius:var(--radius-ctrl);
height:var(--ctrl-height);padding:0 14px;color:var(--text-dark);transition:background .12s;white-space:nowrap}button:active{opacity:.85}
.btn-gray{background:var(--gray);color:var(--text-light)}.btn-gray:hover{background:var(--gray-h)}
.btn-accent{background:var(--accent)}.btn-accent:hover{background:var(--accent-h)}
.btn-accent2{background:var(--accent2)}.btn-accent2:hover{background:var(--accent2-h)}
.btn-success{background:var(--success)}.btn-danger{background:var(--danger)}.btn-warning{background:var(--warning)}
/* Fluent Input/Select */
input,select{font:13px var(--font-family);padding:5px 9px;border:1px solid var(--border);
border-radius:var(--radius-ctrl);background:var(--mica-strong);color:var(--text);outline:none;height:var(--ctrl-height)}
input:focus{border-color:var(--accent)}
#bar{display:flex;align-items:center;gap:8px;height:58px;margin:12px 12px 10px;padding:0 20px;
background:var(--mica-strong);border:1px solid var(--border);border-radius:var(--radius-card);
box-shadow:0 1px 4px rgba(0,0,0,.06);flex-shrink:0}
#bar .t{font-size:20px;font-weight:700;color:var(--accent);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#bar .sub{font-size:12px;color:var(--muted);margin-left:2px;white-space:nowrap}#bar .tool{margin-left:auto;display:flex;gap:10px}
#body{flex:1;display:grid;grid-template-columns:minmax(170px,170px) minmax(0,1fr);gap:8px;padding:0 12px;overflow:hidden;min-height:0}
#nav{background:var(--mica-strong);border:1px solid var(--border);border-radius:var(--radius-card);
padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
#nav .nt{font-weight:600;color:var(--accent);font-size:14px;padding:4px 8px 14px;line-height:1.4}
#nav button{height:42px;text-align:left;padding:0 12px;background:transparent;color:var(--text-light);width:100%;
position:relative;font-size:13px;transition:background .12s,color .12s}
#nav button:hover{background:var(--gray)}
#nav button.on{background:var(--row-hover);color:var(--accent);font-weight:600}
#nav button.on::after{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
#pages{position:relative;overflow:hidden;min-height:0;min-width:0}
.page{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.page.show{display:flex;animation:page-enter .14s ease-out both}
@keyframes page-enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.page.show{animation:none}}
#pageHome{align-items:center;overflow-y:auto;padding-top:46px}
.home-title{font-size:30px;font-weight:700;
background:linear-gradient(135deg,var(--accent),var(--accent2));
-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.home-sub{color:var(--muted);margin:6px 0 26px;font-size:13px}
.home-card{width:520px;max-width:92%;height:88px;border-radius:var(--radius-card);color:#fff;font-size:15px;
font-weight:600;line-height:1.5;margin:7px 0;text-align:left;padding:0 22px;white-space:normal;
box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .15s,box-shadow .15s,filter .15s}
.home-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.2);filter:brightness(1.05)}
.home-card:active{transform:translateY(0) scale(.99)}
.home-card small{display:block;font-size:12px;font-weight:400;opacity:.92}
#pageSettings{overflow-y:auto;align-items:center}
.settings-box{width:480px;max-width:92%;margin-top:36px}
#editGrid{flex:1;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,1fr);gap:8px;overflow:hidden;min-height:0}
#editLeft{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;min-width:0}
#right{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.group{background:var(--mica);border:1px solid var(--border);border-radius:var(--radius-card);
padding:0 14px 12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.group>.gtitle{font-weight:600;color:var(--accent);padding:10px 0 6px;display:flex;align-items:center;gap:8px}
.group>.gtitle::before{content:'';width:4px;height:14px;border-radius:2px;background:var(--accent);flex-shrink:0}#groupList{display:flex;flex-direction:column;flex:1;min-height:0}.radio-row{display:flex;gap:24px;padding:2px 0}
.radio-item{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;user-select:none}.radio-dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--accent);position:relative;flex-shrink:0}
.radio-item.on .radio-dot::after{content:'';position:absolute;inset:2px;border-radius:50%;background:var(--accent)}.mode-hint{font-style:italic;font-size:12px;color:var(--accent);padding-top:5px}.frow{display:flex;align-items:center;gap:5px}.frow .lbl{font-size:12px;flex-shrink:0}
.frow input{flex:1;min-width:80px}
#dropOverlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:9999;font-size:22px;font-weight:600;color:#fff;
border:3px dashed var(--accent);pointer-events:none}#dropOverlay.show{display:flex}
.chg-detail{white-space:pre-wrap;font-size:11px;line-height:1.5;padding:6px 10px;max-height:150px;overflow:auto;border-radius:8px;background:var(--mica-strong);
margin:2px 8px 4px;color:var(--text)}#infoToggle{width:90px;margin-bottom:6px}
#infoContent{background:var(--mica-strong);border-radius:var(--radius-card);overflow:hidden;
transition:height .15s;height:2px;padding:0 5px}#infoContent.open{height:auto;padding:8px 5px}.info-grid{display:grid;grid-template-columns:auto 220px auto;gap:6px 6px;align-items:center}.info-grid .ilbl{font-size:12px;text-align:right;padding-right:4px}
.info-grid select,.info-grid input{width:220px}
.mini-btn{width:30px;height:30px;border-radius:6px;font-size:11px;padding:1px 8px;cursor:pointer;color:var(--text-light);background:var(--mica-strong);border:1px solid var(--border)}
.compat{font-size:12px;font-weight:600}.compat.ok{color:var(--success)}.compat.bad{color:var(--danger)}.compat.warn{color:var(--warning)}
.tool-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.tool-row button{flex-shrink:0}#searchEntry{flex:1;min-width:120px}#btnClearSearch{width:30px;padding:0}#btnAddLocal{display:none}body.offline #btnAddLocal{display:block}
.tbl-hdr{display:flex;height:40px;background:var(--header);border:1px solid var(--border);
border-radius:var(--radius-card);align-items:center;overflow:hidden}
.tbl-hdr div{font-weight:600;font-size:13px;color:var(--text);padding:4px;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
#tree{overflow-y:auto;border-radius:var(--radius-card);margin-top:4px;flex:1;min-height:120px;
background:var(--zebra)}.mrow{display:flex;height:32px;align-items:center;border-radius:var(--radius-ctrl);cursor:default;overflow:hidden;transition:background .1s,box-shadow .1s}.mrow div{font-size:12px;padding:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}.mrow.zebra{background:var(--zebra)}
.mrow:hover{background:var(--row-hover)}.mrow.sel{background:var(--selected);box-shadow:inset 3px 0 0 var(--accent)}.empty-hint{margin:10px;padding:26px 20px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--border);border-radius:var(--radius-card)}#groupLog{flex:1;display:flex;flex-direction:column;min-height:0;margin-bottom:0}
#logText{flex:1;overflow-y:auto;font:12px Consolas,'Cascadia Mono',monospace;white-space:pre-wrap;word-break:break-all;background:var(--mica-strong);border:1px solid var(--border);
border-radius:var(--radius-ctrl);padding:6px 8px;min-height:100px}
#status{height:32px;background:var(--mica-strong);color:var(--text);border-top:1px solid var(--border);display:flex;align-items:center;
padding:0 14px;font-size:12px;flex-shrink:0;margin-top:0}#statusTxt{flex:1}
#progressPct{display:inline-block;width:42px;text-align:right;color:var(--muted);flex-shrink:0}
#progressPct:empty{display:none}
#progress{width:210px;height:8px;border-radius:var(--radius-ctrl);overflow:hidden;background:rgba(128,128,128,.4);
display:none;margin-left:10px;flex-shrink:0}#progress i{display:block;height:100%;width:0;
background:var(--accent);border-radius:var(--radius-ctrl);transition:width .15s}
@keyframes indet{0%{margin-left:-40%;width:40%}100%{margin-left:100%;width:40%}}
#progress.indet i{animation:indet 1s linear infinite;transition:none}
#editGrid.no-log{grid-template-columns:1fr}#editGrid.no-log #right{display:none}
.chk{width:16px;height:16px;border-radius:var(--radius-ctrl);border:2px solid var(--accent);display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--text-dark);font-size:11px;line-height:1;flex-shrink:0}.chk.on{background:var(--accent)}.chk.on::after{content:'✓'}#bottomBtns{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;justify-content:center;flex-shrink:0}#bottomBtns button{width:120px}#btnPack{width:auto}
.win-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);display:none;z-index:99;
align-items:center;justify-content:center}.win-ov.show{display:flex}
.win{background:var(--mica);border:1px solid var(--border);border-radius:max(var(--radius-card),10px);
box-shadow:0 16px 48px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;animation:win-pop .16s ease-out}
@keyframes win-pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@media(prefers-reduced-motion:reduce){.win{animation:none}}
.win-hd{padding:10px 16px;font-weight:600;color:var(--accent);font-size:16px;border-bottom:1px solid var(--border);
display:flex;justify-content:space-between;align-items:center}.win-hd .x{background:none;border:none;color:var(--muted);font-size:16px;height:auto;padding:2px 6px}.win-hd .x:hover{color:var(--text)}.win-bd{flex:1;overflow:auto;padding:8px 10px;min-height:0}
.win-ft{padding:8px 10px;display:flex;gap:8px;justify-content:center;border-top:1px solid var(--border)}.sel-row{display:flex;align-items:center;border-radius:var(--radius-ctrl);padding:2px 0;cursor:pointer}.sel-row:hover{background:var(--row-hover)}.sel-row.on{background:var(--accent);color:#fff}
.sel-row.zebra{background:var(--zebra)}.sel-row.zebra:hover,.sel-row.zebra.on{background:var(--row-hover)}.sel-row.zebra.on{background:var(--accent);color:#fff}.sel-row div{font-size:12px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.hint{font-size:12px;color:var(--muted)}.italic-warn{font-style:italic;font-size:12px;color:var(--warning);text-align:center;padding:2px 0}.bold-md{font-size:16px;font-weight:600;text-align:center;padding:10px 0 2px}
/* ===== 细滚动条 ===== */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-h);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);border:2px solid transparent;background-clip:content-box}
/* ===== 响应式断点 ===== */
@media (max-width:1200px){
  #editGrid{grid-template-columns:1fr}
  #right{display:none}
  #editGrid.force-log{grid-template-columns:minmax(0,4fr) minmax(0,1fr)}
  #editGrid.force-log #right{display:flex}
}
@media (max-width:900px){
  #body{grid-template-columns:56px minmax(0,1fr)}
  #nav .nt{display:none}
  #nav{padding:10px 6px}
  #nav button{font-size:0;padding:0;text-align:center}
  /* 窄屏隐藏文字后用 ::before 显示图标（宽屏时 LANG 文案自带图标，不重复加） */
  #nav button::before{font-size:18px}
  #navHome::before{content:'🏠'}#navEdit::before{content:'✏️'}#navSettings::before{content:'⚙️'}
  #nav button.on::after{display:none}
}
@media (max-width:600px){
  #bar{margin:8px 8px 8px;padding:0 10px}
  #bar .t{font-size:15px;flex:1}
  #bar .sub{display:none}
}
</style>
</head>
<body><div id="bar">
  <span class="t" id="tTitle"></span><span class="sub" id="tSub"></span>
</div>
<div id="body">
<div id="nav">

  <button id="navEdit" onclick="show_page('edit')"></button>

      <div class="group"><div class="gtitle" id="gSettings"></div>

          <div class="radio-row">
            <span class="radio-item" id="langZh" onclick="set_lang('zh_CN')"><span class="radio-dot"></span><span id="langZhTxt"></span></span>
            <span class="radio-item" id="langEn" onclick="set_lang('en_US')"><span class="radio-dot"></span><span id="langEnTxt"></span></span>
          </div>
          <div style="font-weight:600;padding:14px 0 6px" id="lblTheme"></div>

            <button class="btn-gray" style="width:120px" id="btnThemeLight" onclick="set_theme('light')"></button>
          </div>

          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="page" id="pageEdit">
   <div id="editGrid">
    <div id="editLeft">
  <div class="group"><div class="gtitle" id="gFile"></div>
    <div class="frow">
      <span class="lbl" id="lblPath"></span>
      <input id="entryFile" readonly placeholder="modrinth.index.json" style="flex:1">
    </div>
  </div>
  <div class="group"><div class="gtitle" id="gInfo"></div>

      <button class="btn-gray" id="infoToggle" style="width:90px" onclick="toggle_info()">▶ 展开</button>

    </div>
    <div id="infoContent">

        <span class="ilbl" id="lblName"></span><input id="entryName" value="我的整合包">
        <span></span>
        <span class="ilbl" id="lblVersion"></span><input id="entryVersion" value="1.0.0">
        <span></span>
        <span class="ilbl" id="lblMc"></span>
        <select id="comboMc"><option>1.20.1</option></select>
        <button class="btn-gray mini-btn" onclick="fetch_mc_versions()">🔄</button>

function normalize_version(v){v=String(v||'').trim();
  v=v.replace(/^mc[\d.\-]+-/,'');v=v.replace(/[+\-]fabric.*$/,'');
  v=v.replace(/[+\-]forge.*$/,'');v=v.replace(/[+\-]neoforge.*$/,'');
  v=v.replace(/\+\d{1,3}(\.\d{1,3}){0,2}$/,'');return v;}
function extract_version(filename){const m=String(filename||'').match(/(\d+(?:\.\d+)+)/);
  return m?m[1]:tr('ver_unknown');}
function compare_simple(v1,v2){const p=v=>normalize_version(v).match(/\d+/g)||[];
  const a=p(v1).map(Number),b=p(v2).map(Number);
  if(!a.length&&!b.length)return 0;if(!a.length)return -1;if(!b.length)return 1;
  for(let i=0;i<Math.max(a.length,b.length);i++){
    const n1=a[i]||0,n2=b[i]||0;if(n1!==n2)return n1-n2;}return 0;}
function parse_project_id_from_url(url){if(!url)return null;
  let m=String(url).match(/cdn\.modrinth\.com\/data\/([a-zA-Z0-9_-]+)/);
  if(m)return m[1];
  m=String(url).match(/modrinth\.com\/(?:mod|project)\/([a-zA-Z0-9_-]+)/);
  if(m)return m[1];
  const last=String(url).split('/').pop();
  if(/^[a-zA-Z0-9_-]+$/.test(last))return last;return null;}

async function sha512_hex(buf){const h=await crypto.subtle.digest('SHA-512',buf);

/* api_get：并发去重 + 可选 TTL 缓存（ttl 毫秒；0=仅去重不缓存，保证更新检查等场景结果新鲜） */
const API_CACHE=new Map();
async function api_get(url,ttl=0){
  const hit=API_CACHE.get(url);
  if(hit){
    if(hit.p)return hit.p;
    if(ttl>0&&Date.now()-hit.t<ttl)return hit.d;}
  if(API_CACHE.size>800)API_CACHE.clear();
  const opt=(window.AbortSignal&&AbortSignal.timeout)?{signal:AbortSignal.timeout(CF_WIDGET_TIMEOUT)}:undefined;
  const p=(async()=>{const r=await fetch(url,opt);
    if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})();
  const entry={t:Date.now(),d:null,p};
  API_CACHE.set(url,entry);
  try{entry.d=await p;}catch(e){API_CACHE.delete(url);throw e;}
  entry.t=Date.now();entry.p=null;return entry.d;}
/* 裸 fetch 统一 30s 超时（旧浏览器无 AbortSignal.timeout 则不限制） */

  return Array.isArray(data.hits)?data.hits:[];}

    .sort((a,b)=>{const A=a.split('.').map(Number),B=b.split('.').map(Number);
      for(let i=0;i<Math.max(A.length,B.length);i++){
        const x=A[i]||0,y=B[i]||0;if(x!==y)return y-x;}return 0;});}
async function api_fetch_forge_for_mc(mc,force){

const CF_CACHE_TTL=3600*1000,CF_CACHE_FAIL_TTL=300*1000;
async function cf_get_project(pid,tries=4,force_refresh=false){
  /* cfwidget 项目信息，带 TTL 缓存：成功 1h，失败 5min；force_refresh 强制刷新 */
  const now=Date.now();
  if(!force_refresh&&CF_PROJ_CACHE.has(pid)){
    const{ts,data}=CF_PROJ_CACHE.get(pid);
    const ttl=data!==null?CF_CACHE_TTL:CF_CACHE_FAIL_TTL;
    if(now-ts<ttl)return data;}
  let lastErr=null;
  for(let i=0;i<tries;i++){
    try{const opt=(window.AbortSignal&&AbortSignal.timeout)?{signal:AbortSignal.timeout(REQUEST_TIMEOUT)}:undefined;
      const r=await fetch(`https://api.cfwidget.com/${pid}`,opt);
      let j=null;try{j=await r.json();}catch{}
      const err=(j&&j.error)||'';
      /* cfwidget 排队时返回 202 + {error:'in_queue'}，r.ok 为 true，需在此识别重试 */
      if(r.status===200&&j&&Array.isArray(j.files)&&j.files.length){
        CF_PROJ_CACHE.set(pid,{ts:Date.now(),data:j});return j;}
      if(err==='in_queue'||err==='creating'){lastErr=`HTTP ${r.status} ${err}`;}
      else{lastErr=`HTTP ${r.status} ${err||(j?'empty response':'bad response')}`;break;}}
    catch(e){lastErr=String(e&&e.message||e);break;}
    await new Promise(res=>setTimeout(res,2500));}
  if(lastErr)log(`[CF] cfwidget ${pid}: ${lastErr}`,'WARNING');
  CF_PROJ_CACHE.set(pid,{ts:Date.now(),data:null});return null;}
const CF_LOADER_TAGS={fabric:['Fabric'],forge:['Forge'],neoforge:['NeoForge']};
const CF_LOADER_FAMILIES=['Fabric','Quilt','Forge','NeoForge'];
async function cf_get_project_versions(pid,mc_ver,loader){
  /* 获取 CurseForge 项目标准化版本列表：[{file_id,name,versions,filesize,released_at,url}]
     loader 非空时按加载器标签过滤（cfwidget 文件 versions 数组同时含 MC 版本与加载器名） */
  const pj=await cf_get_project(pid);
  if(!pj||!pj.files)return[];
  const tags=loader?(CF_LOADER_TAGS[loader]||[]):[];
  const out=[];
  for(const fo of pj.files){
    const fv=fo.versions||[];
    if(mc_ver&&fv.length&&!fv.includes(mc_ver))continue;
    if(tags.length){
      const hasLoaderTag=fv.some(v=>CF_LOADER_FAMILIES.includes(v));
      if(hasLoaderTag&&!tags.some(t=>fv.includes(t)))continue;}
    out.push({file_id:fo.id||0,name:fo.name||'',versions:fv,
      filesize:fo.filesize||0,released_at:fo.releasedAt||fo.uploaded_at||'',
      url:cf_cdn_url(fo.id||0,fo.name||'')});}
  return out;}

async function handle_open_file(f){
  const batch=begin_pack_open();
  log(trf('log_opening',{name:f.name}));set_status(tr('status_loading'));progress_show(true);
  try{const zip=await(await loadJsZip()).loadAsync(f);
    if(!is_current_pack_open(batch))return;
    const idx=zip.file('modrinth.index.json');
    let nextData,nextFormat='modrinth',nextCfPending=null;
    if(idx)nextData=JSON.parse(await idx.async('string'));
    else{
      const man=zip.file('manifest.json');
      if(!man)throw new Error(tr('dialog_open_mrpack_fail'));
      let m=null;try{m=JSON.parse(await man.async('string'));}catch{}
      if(!m||!m.minecraft)throw new Error(tr('dialog_open_cf_fail'));
      nextData=cf_manifest_to_index(m);nextFormat='curseforge';
      nextCfPending=(m.files||[]).map(x=>({projectID:+x.projectID||0,
        fileID:+x.fileID||0,required:x.required!==false}));
    }
    // 扫描覆盖文件：overrides 与客户端专用目录合并到工作区（同名时客户端覆盖通用），server-overrides 原样保留
    const ovFiles=new Map();
    let nOv=0,nCli=0,nSrv=0;
    const cut=p=>p.slice(p.indexOf('/')+1);
    await Promise.all(Object.values(zip.files).filter(z=>!z.dir).map(async z=>{
      const p=z.name;
      if(p.startsWith('overrides/')){ovFiles.set(cut(p),await z.async('blob'));nOv++;}
      else if(nextFormat==='curseforge'&&p.startsWith('clientoverrides/')){ovFiles.set(cut(p),await z.async('blob'));nCli++;}
      else if(nextFormat==='modrinth'&&p.startsWith('client-overrides/')){ovFiles.set(cut(p),await z.async('blob'));nCli++;}
      else if(nextFormat==='modrinth'&&p.startsWith('server-overrides/')){ovFiles.set(p,await z.async('blob'));nSrv++;}
    }));
    if(!is_current_pack_open(batch))return;
    INDEX_DATA=nextData;PACK_FORMAT=nextFormat;
    window._cfPending=nextCfPending;window._localJars=new Map();window._ovFiles=ovFiles;
    if(nextCfPending)log(trf('log_cf_open',{count:nextCfPending.length}));
    $('entryFile').value=f.name;
    refresh_format_buttons();
    apply_metadata(INDEX_DATA);refresh_mod_list();save_index_to_state();
    progress_hide();
    set_status(tr('status_ready'));
    show_page('edit');
    if(window._cfPending&&window._cfPending.length)resolve_cf_entries(window._cfPending);
    if(nOv+nCli)log(trf('log_ov_applied',{n:nOv+nCli,c:nCli}),'SUCCESS');
    if(nSrv)log(trf('log_ov_server',{n:nSrv}),'WARNING');
    alert(trf('dialog_success_open',{file:f.name}));
  }catch(e){if(!is_current_pack_open(batch))return;
    log(trf('dialog_open_fail',{error:e.message}),'ERROR');
    progress_hide();
    alert(trf('dialog_open_fail',{error:e.message}));set_status(tr('status_ready'));}}

function save_index_to_state(){if(!INDEX_DATA)return false;
  INDEX_DATA.name=$('entryName').value.trim();
  INDEX_DATA.versionId=$('entryVersion').value.trim();
  INDEX_DATA.dependencies=INDEX_DATA.dependencies||{};
  INDEX_DATA.dependencies.minecraft=$('comboMc').value.trim();
  const k=LOADER_KEYS[$('comboLoaderType').value];
  ['fabric-loader','forge','neoforge'].forEach(key=>{if(key!==k)delete INDEX_DATA.dependencies[key];});
  if($('comboLoaderVer').value)INDEX_DATA.dependencies[k]=$('comboLoaderVer').value.trim();
  INDEX_DATA.files=ALL_MODS.map(m=>m.raw_entry);
  return true;}
let BACKUPS=[];
function snapshot_to_backups(){if(!INDEX_DATA)return;
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const ts=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  BACKUPS.push({ts,name:$('entryFile').value||'modrinth.index.json',
    data:JSON.parse(JSON.stringify(INDEX_DATA))});
  if(BACKUPS.length>30)BACKUPS.shift();}
function backup_silent(){if(!INDEX_DATA)return;
  snapshot_to_backups();
  log(tr('status_backup'),'SUCCESS');}
function manual_backup(){if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  save_index_to_state();
  snapshot_to_backups();
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const ts=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  const name=`${$('entryFile').value||'modrinth.index.json'}.backup_${ts}`;
  dl_blob(new Blob([JSON.stringify(INDEX_DATA,null,2)],{type:'application/json'}),name);
  log(trf('dialog_backup_success',{path:name}),'SUCCESS');
  set_status(tr('status_backup'));}
function dl_blob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);}
function current_files(){return INDEX_DATA?INDEX_DATA.files||[]:[];}
function refresh_mod_list(silent){if(!INDEX_DATA)return;
  const batch=++NAME_BATCH,missingNames=new Map(),pathOccurrences=new Map();
  ALL_MODS=[];
  for(const entry of current_files()){
    const p=entry.path||'';const filename=p.split(/[/\\]/).pop();
    const version=extract_version(filename);
    let project_id=null;
    if(entry.downloads&&entry.downloads.length)
      project_id=parse_project_id_from_url(entry.downloads[0]);
    let display_name=project_id?(NAME_CACHE[project_id]||filename):filename;
    if(entry.cf)display_name=CF_NAME_CACHE.get(entry.cf.projectID)||filename;
    const occurrence=pathOccurrences.get(p)||0;pathOccurrences.set(p,occurrence+1);
    const mod_entry={path:p,filename,version,display_name,project_id,
      etype:entry_type(entry),raw_entry:entry,is_cf:!!entry.cf,_rowKey:`${p}\u0000${occurrence}`};
    ALL_MODS.push(mod_entry);
    if(project_id&&!NAME_CACHE[project_id]){
      if(!missingNames.has(project_id))missingNames.set(project_id,[]);
      missingNames.get(project_id).push(mod_entry);}}
  const activeKeys=new Set(ALL_MODS.map(m=>m._rowKey));
  for(const key of ROW_CACHE.keys())if(!activeKeys.has(key))ROW_CACHE.delete(key);
  apply_filter();
  if(missingNames.size)fetch_mod_names(missingNames,batch);
  if(!silent)log(trf('log_refresh',{count:ALL_MODS.length}),'SUCCESS');}
async function fetch_mod_names(missingNames,batch){
  await pool_run([...missingNames.keys()],8,async pid=>{
    const name=await api_fetch_project_name(pid);
    (missingNames.get(pid)||[]).forEach(entry=>entry.display_name=name);});
  if(NAME_BATCH===batch)apply_filter();}
function debounce_filter(){clearTimeout(FILTER_TIMER);
  FILTER_TIMER=setTimeout(apply_filter,300);}
function clear_search(){$('searchEntry').value='';apply_filter();}
function match_entry(e,kw){kw=(kw||'').trim().toLowerCase();
  if(!kw)return true;
  const f=[e.display_name,e.filename,e.path,e.version];
  return f.some(v=>String(v||'').toLowerCase().includes(kw));
}
function apply_filter(){const kw=$('searchEntry').value.trim().toLowerCase();
  render_rows(!kw?ALL_MODS:ALL_MODS.filter(e=>match_entry(e,kw)));}
function render_rows(filtered){
  if(filtered===undefined)filtered=ALL_MODS;
  const tree=$('tree');
  if(!tree)return;
  tree.replaceChildren();ROWS=[];
  const generation=++ROW_RENDER_BATCH;
  ROW_RENDER_PENDING=false;
  if(!INDEX_DATA){
    tree.appendChild(el('div','empty-hint',tr('edit_empty_hint')));return;}
  if(!filtered.length){
    tree.appendChild(el('div','empty-hint',
      $('searchEntry').value.trim()?tr('search_no_result'):tr('edit_empty_mods')));return;}
  const chunkSize=60,unknownLabel=tr('unknown');
  ROW_RENDER_PENDING=filtered.length>0;
  function renderChunk(start=0){
    if(generation!==ROW_RENDER_BATCH||!tree.isConnected)return;
    const fragment=document.createDocumentFragment(),end=Math.min(start+chunkSize,filtered.length);
    for(let idx=start;idx<end;idx++){
      const entry=filtered[idx],key=entry._rowKey||`${entry.path||''}\u0000${idx}`;
      let row=ROW_CACHE.get(key);
      if(!row){row=el('div',null,null,'mrow');row._cells=[];
        COL_WIDTHS.forEach(w=>{const cell=el('div','width:'+w);
          row.appendChild(cell);row._cells.push(cell);});
        ROW_CACHE.set(key,row);}
      row._raw=entry;row._selected=false;
      row.classList.toggle('zebra',idx%2===1);row.classList.remove('sel');
      const vals=[entry.display_name||entry.filename||unknownLabel,entry.filename||'',
        entry.version||'',type_label(entry.etype||'mod'),entry.path||''];
      row._cells.forEach((cell,i)=>{if(cell.textContent!==String(vals[i]))cell.textContent=vals[i];});
      fragment.appendChild(row);ROWS.push(row);}
    tree.appendChild(fragment);
    if(end<filtered.length)requestAnimationFrame(()=>renderChunk(end));
    else ROW_RENDER_PENDING=false;}
  renderChunk();}
function toggle_row(row){row._selected=!row._selected;
  row.classList.toggle('sel',row._selected);}
function selected_rows(){return ROWS.filter(r=>r._selected);}
function delete_selected(){const sel=selected_rows();
  if(!sel.length){alert(tr('dialog_select_mod'));return;}
  if(!confirm(trf('dialog_confirm_delete',{count:sel.length})))return;
  const paths=new Set(sel.map(r=>r._raw.path));
  paths.forEach(p=>{window._localJars&&window._localJars.delete(p);
    window._ovFiles&&window._ovFiles.delete(p);});
  INDEX_DATA.files=current_files().filter(f=>!paths.has(f.path));
  log(trf('log_delete_mod',{count:sel.length}),'SUCCESS');
  refresh_mod_list();save_index_to_state();reload_metadata();}
function remove_duplicate_entry(pack,entry,local_jars,override_files){
  const path=entry.path;
  pack.files=(pack.files||[]).filter(f=>f!==entry);
  if(!(pack.files||[]).some(f=>f.path===path)){
    local_jars&&local_jars.delete(path);override_files&&override_files.delete(path);}
  return pack.files.length;}
function open_mods_folder(){if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  alert(tr('browser_no_folder'));}
async function fetch_mc_versions(){log(tr('log_mc_fetching'));
  set_status(tr('status_loading'));
  try{const versions=await api_fetch_mc_versions();
    const sel=$('comboMc');const cur=sel.value.trim();
    sel.innerHTML = ''; // 清空现有内容
    versions.forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;sel.appendChild(o);});
    /* 保留当前已选版本（打开整合包后后台加载列表不应覆盖包内版本） */
    if(cur&&!versions.includes(cur)){
      const o=document.createElement('option');o.value=o.textContent=cur;sel.appendChild(o);}
    sel.value=cur||versions[0]||'1.20.1';
    log(trf('log_mc_fetched',{count:versions.length}),'SUCCESS');
    update_loader_dropdown_for_mc(sel.value.trim());
  }catch(e){log(tr('log_mc_fetch_fail'),'ERROR');}
  set_status(tr('status_ready'));}
/* 按当前加载器获取版本表（Fabric 走 meta API，Forge/NeoForge 走各自 maven），避免把 Fabric 版本写进其他加载器的依赖 */
async function fetch_loader_versions(force_refresh=false){
  const loader=$('comboLoaderType').value||'Fabric';
  log(trf('log_loader_fetching',{loader}));set_status(tr('status_loading'));
  try{
    if(loader==='Fabric'){
      const[versions]=await api_fetch_fabric_versions(force_refresh);
      const mc_ver=$('comboMc').value.trim();
      let compatible=[];if(mc_ver)compatible=await api_fetch_fabric_for_mc(mc_ver,force_refresh);
      if(!versions.length&&!compatible.length){
        log(trf('log_loader_fetch_fail',{loader}),'ERROR');set_status(tr('status_ready'));return;}
      apply_loader_versions(versions,compatible,mc_ver);
    }else{
      const mc_ver=$('comboMc').value.trim();
      const compatible=mc_ver?await api_fetch_loader_versions_for_mc(loader,mc_ver):[];
      if(!compatible.length){
        log(trf('log_loader_fetch_fail',{loader}),'ERROR');set_status(tr('status_ready'));return;}
      apply_loader_versions([],compatible,mc_ver);}
  }catch(e){log(trf('log_loader_fetch_fail',{loader}),'ERROR');}
  set_status(tr('status_ready'));}
function apply_loader_versions(all_versions,compatible,mc_ver){
  set_status(tr('status_ready'));
  const loader=$('comboLoaderType').value||'Fabric';
  const sel=$('comboLoaderVer'),cur=sel.value.trim();
  if(mc_ver&&compatible.length){fill_select(sel,compatible);
    sel.value=compatible.includes(cur)?cur:compatible[0];
    log(trf('log_mc_compat',{mc:mc_ver,count:compatible.length,loader}));}
  else{fill_select(sel,all_versions);
    sel.value=all_versions.includes(cur)?cur:(all_versions[0]||'');
    if(mc_ver&&!compatible.length)log(trf('log_mc_compat_none',{mc:mc_ver,count:all_versions.length}),'WARNING');
    else log(trf('log_loader_fetched',{count:all_versions.length,loader}),'SUCCESS');}
  check_loader_compatibility();}
function fill_select(sel,list){sel.innerHTML = ''; // 清空现有内容
  list.forEach(v=>{const o=document.createElement('option');o.value=o.textContent=v;sel.appendChild(o);});}
async function update_loader_dropdown_for_mc(mc_ver){
  const loader=$('comboLoaderType').value||'Fabric';
  const compatible=await api_fetch_loader_versions_for_mc(loader,mc_ver);
  if(!compatible.length){log(trf('log_loader_compat_none',{mc:mc_ver,loader}),'WARNING');return;}
  const sel=$('comboLoaderVer'),cur=sel.value.trim();
  fill_select(sel,compatible);
  sel.value=compatible.includes(cur)?cur:(compatible[0]||'');
  check_loader_compatibility();}
function loader_type_changed(){if(!INDEX_DATA)return;
  /* 切换加载器：先清空版本下拉并保存（防止旧加载器版本串写进新依赖键），再按新加载器刷新 */
  fill_select($('comboLoaderVer'),[]);
  save_index_to_state();
  fetch_loader_versions(true);}
async function check_loader_compatibility(){
  const mc_ver=$('comboMc').value.trim(),loader_name=$('comboLoaderType').value;
  if(!mc_ver||!loader_name)return;
  const lbl=$('compatLabel');
  /* 只有 Fabric 有在线兼容元数据；Forge/NeoForge 不检测，避免误报 */
  if(loader_name!=='Fabric'){lbl.textContent=tr('compat_skipped');lbl.className='compat';return;}
  const compatible=await api_fetch_fabric_for_mc(mc_ver);
  const current=$('comboLoaderVer').value.trim();
  if(!compatible.length){lbl.textContent=tr('compat_unknown');lbl.className='compat warn';}
  else if(!current){lbl.textContent=tr('compat_unsupported');lbl.className='compat warn';}
  else if(compatible.includes(current)){lbl.textContent=tr('compat_compatible');lbl.className='compat ok';}
  else{lbl.textContent=tr('compat_incompatible');lbl.className='compat bad';}}
async function fetch_versions_from_url(){
  const pack=INDEX_DATA;
  const url=$('urlEntry').value.trim();
  if(!url){alert(tr('warn_need_url'));return;}
  const project_id=parse_project_id_from_url(url);
  if(!project_id){alert(tr('err_parse_pid'));return;}
  log(trf('log_fetch_versions',{pid:project_id}));set_status(tr('status_loading'));
  const mc_ver=$('comboMc').value.trim();
  let add_type=ADD_TYPE;
  try{
    const meta=await api_fetch_project_meta(project_id);
    if(INDEX_DATA!==pack){log(tr('log_async_pack_changed'),'WARNING');set_status(tr('status_ready'));return;}
    const mapped=project_type_to_add_type(meta?meta.project_type:'mod');
    if(mapped!=='mod')add_type=mapped;
    set_add_type(add_type);
    const loader_api=add_type==='mod'?(LOADER_API[$('comboLoaderType').value]||'fabric'):null;
    const all_v=await api_get_all_versions(project_id,mc_ver,loader_api);
    if(INDEX_DATA!==pack){log(tr('log_async_pack_changed'),'WARNING');set_status(tr('status_ready'));return;}
    if(!all_v.length){alert(tr('dialog_no_version'));set_status(tr('status_ready'));return;}
    let default_v=all_v.filter(v=>v.featured);
    if(!default_v.length)default_v=all_v.slice(0,1);
    show_selector(default_v,all_v,project_id,mc_ver,loader_api,
      version=>add_version(version,entry_prefix(add_type),pack));
  }catch(e){alert(trf('dialog_version_fetch',{error:e.message}));}
  set_status(tr('status_ready'));}
function search_projects_to_add(){
  const initialQuery=$('projectSearchEntry').value.trim();
  build_win(tr('search_project_title'),'760px','600px',win=>{
    win.bd.style.display='flex';win.bd.style.flexDirection='column';

    inp.placeholder=tr('search_project_placeholder');

    let requestId=0;
    const search=async()=>{
      const query=inp.value.trim();if(!query)return;
      const id=++requestId,addType=ADD_TYPE,mc=$('comboMc').value.trim(),pack=INDEX_DATA;

      st.textContent=tr('search_projecting');results.replaceChildren();

          const pick=mkbtn(tr('search_project_select'),'btn-accent','140px',()=>{
            if(!h.project_id)return;

function show_selector(default_versions,all_versions,project_id,mc_ver,loader_api,on_select_callback){
  build_win(trf('selector_title',{id:project_id}),'1000px','650px',win=>{
    const col_widths=['25%','25%','23%','18%','9%'];
    const headers=[tr('col_version'),tr('col_game_version'),tr('col_loader'),tr('col_date'),tr('col_recommended')];
    const hdr=el('div',null,null,'tbl-hdr');hdr.style.margin='10px 10px 4px';
    headers.forEach((h,i)=>hdr.appendChild(el('div','width:'+col_widths[i],h)));
    win.bd.parentNode.insertBefore(hdr,win.bd);
    const rows_ref={cur:null,all:[]};
    const scroll=win.bd;
    function populate(vlist){
      rows_ref.all.forEach(r=>r.remove());rows_ref.all=[];rows_ref.cur=null;
      vlist.forEach(v=>{const row=el('div',null,null,'sel-row');
        row._version=v;
        const vals=[v.version_number||'N/A',(v.game_versions||[]).join(', '),
          (v.loaders||[]).join(', '),(v.date_published||'').slice(0,10),v.featured?'⭐':''];
        vals.forEach((val,i)=>{const c=el('div','width:'+col_widths[i],val);
          c.style.textAlign=i<4?'left':'center';
          c.onclick=()=>select(row);row.appendChild(c);});
        row.onclick=()=>select(row);
        scroll.appendChild(row);rows_ref.all.push(row);});
      win.title.textContent=trf('selector_title_count',{id:project_id,count:vlist.length});}
    function select(row){if(rows_ref.cur)rows_ref.cur.classList.remove('on');
      rows_ref.cur=row;row.classList.add('on');}
    function on_select(){if(!rows_ref.cur){alert(tr('dialog_select_version'));return;}
      const ver=rows_ref.cur._version;
      const matched=all_versions.find(v=>v.version_number===ver.version_number);
      if(matched){close_win();
        if(on_select_callback)on_select_callback(matched);
        else add_version(matched);}
      else alert(tr('data_error'));}
    function toggle(){
      if(toggle.state!=='all'){populate(all_versions);toggle.state='all';
        win.btnToggle.textContent=tr('button_show_recommended');}
      else{populate(default_versions);toggle.state='default';
        win.btnToggle.textContent=tr('button_show_all');}}
    toggle.state='default';
    const ft=win.ft;
    const b1=mkbtn(tr('button_select_this'),'btn-success','120px',on_select);
    const b2=mkbtn(tr('button_show_all'),'btn-accent2','185px',toggle);win.btnToggle=b2;
    const b3=mkbtn(tr('button_cancel'),'btn-gray','100px',close_win);
    ft.append(b1,b2,b3);
    if(mc_ver||loader_api){
      const ftxt=trf('selector_filter',{filter:`Minecraft ${mc_ver}`+(loader_api?` + ${loader_api}`:'')});
      const filterLbl=el('div','text-align:center;padding:2px 0',ftxt,'hint');
      win.ft.parentNode.insertBefore(filterLbl,win.ft);}
    populate(default_versions);});}
function build_mod_entry(version_data,prefix='mods'){
  const f=version_data.files[0],pre=prefix||'mods';
  const e={path:`${pre}/${f.filename}`,
    hashes:{sha1:(f.hashes&&f.hashes.sha1)||'',sha512:(f.hashes&&f.hashes.sha512)||''},
    downloads:[f.url],fileSize:f.size||0};
  if(f.env)e.env=f.env;  // 保留 Modrinth client/server 环境标记
  return e;}
function add_version(version_data,prefix='mods',expected_pack=INDEX_DATA){
  try{const f=version_data.files[0];const filename=f.filename;
    if(!expected_pack||INDEX_DATA!==expected_pack){
      log(tr('log_async_pack_changed'),'WARNING');set_status(tr('status_ready'));return;}
    const entry=build_mod_entry(version_data,prefix);
    if(current_files().some(fe=>fe.path===entry.path)){
      if(!confirm(trf('dialog_version_exists',{filename}))){
        log(trf('log_add_exists',{filename}),'WARNING');return;}}
    if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
    backup_silent();
    INDEX_DATA.files.push(entry);
    log(trf('log_add_mod',{filename}),'SUCCESS');
    refresh_mod_list();save_index_to_state();
    const deps=(version_data.dependencies||[]).map(d=>d.project_id).filter(Boolean);
    if(deps.length)show_dependency_dialog(deps,filename);
  }catch(e){log(trf('log_add_version_fail',{error:String(e)}),'ERROR');
    alert(trf('dialog_version_fetch',{error:String(e)}));}}
function show_dependency_dialog(dep_ids,filename,expected_pack=INDEX_DATA){
  build_win(tr('dialog_dep_prompt'),'700px','500px',win=>{
    win.bd.before(el('div',null,trf('dialog_dep_prompt',{filename}),'bold-md'));
    const installed_ids=new Set();
    current_files().forEach(entry=>{
      if(entry.downloads&&entry.downloads[0]){
        const pid=parse_project_id_from_url(entry.downloads[0]);
        if(pid)installed_ids.add(pid);}});
    const dep_status=[];
    dep_ids.forEach(dep_id=>{const installed=installed_ids.has(dep_id);
      dep_status.push({id:dep_id,name:dep_id,installed});});
    let cur_i=null;const rows=[];
    function select_dep(i){if(cur_i!==null)rows[cur_i].classList.remove('on');
      cur_i=i;rows[i].classList.add('on');}
    function open_selected(){if(cur_i===null){alert(tr('dep_select_first'));return;}
      window.open(`https://modrinth.com/mod/${dep_status[cur_i].id}`);}
    function open_all(){dep_status.forEach(d=>window.open(`https://modrinth.com/mod/${d.id}`));}
    async function install_missing(){
      const missing=dep_status.filter(d=>!d.installed);
      if(!missing.length){alert(tr('dialog_dep_no_missing'));return;}
      if(!confirm(tr('dialog_dep_confirm')))return;
      backup_silent();
      const mc_ver=$('comboMc').value.trim();
      const loader_api=LOADER_API[$('comboLoaderType').value]||'fabric';
      let ok=0;progress_show();
      for(let di=0;di<missing.length;di++){
        if(INDEX_DATA!==expected_pack){
          log(tr('log_async_pack_changed'),'WARNING');progress_hide();set_status(tr('status_ready'));return;}
        const d=missing[di];progress_set(di+1,missing.length);
        log(trf('log_dep_fetch',{name:d.name}));
        try{const latest=await api_get_latest_version(d.id,mc_ver,loader_api);
          if(INDEX_DATA!==expected_pack){
            log(tr('log_async_pack_changed'),'WARNING');progress_hide();set_status(tr('status_ready'));return;}
          if(!latest){log(trf('dialog_dep_fetch_fail',{name:d.name}),'WARNING');continue;}
          const entry=build_mod_entry(latest,'mods');
          if(current_files().some(fe=>fe.path===entry.path)){

function parse_csv_line(line){const out=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(inQ){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c;}
    else if(c==='"')inQ=true;else if(c===','){out.push(cur);cur='';}else cur+=c;}
  out.push(cur);return out;}

function pick_pack_file(){return new Promise(res=>{

function entry_identity_key(e){
  if(e.cf)return'cf:'+e.cf.projectID;
  for(const d of e.downloads||[]){const pid=parse_project_id_from_url(d);
    if(pid)return'mr:'+pid;}
  return'path:'+(e.path||'');}
function diff_pack_files(fa,fb){
  const ma=new Map(),mb=new Map();
  fa.forEach(e=>{if(!ma.has(entry_identity_key(e)))ma.set(entry_identity_key(e),e);});
  fb.forEach(e=>{if(!mb.has(entry_identity_key(e)))mb.set(entry_identity_key(e),e);});
  const only_a=[],only_b=[],changed=[];
  for(const[k,e]of ma){if(!mb.has(k))only_a.push(e);
    else{const eb=mb.get(k);
      const sa=(e.cf&&e.cf.fileID)||(e.hashes&&e.hashes.sha1)||'';
      const sb=(eb.cf&&eb.cf.fileID)||(eb.hashes&&eb.hashes.sha1)||'';
      if(sa&&sb&&sa!==sb)changed.push([e,eb]);}}
  for(const[k,e]of mb)if(!ma.has(k))only_b.push(e);
  return{only_a,only_b,changed};}

  const types=[...((e.dataTransfer||{}).types||[])];
  if(types.includes('Files')){_dragDepth++;dropOverlay.classList.add('show');}});
window.addEventListener('dragleave',e=>{e.preventDefault();
  if(--_dragDepth<=0){_dragDepth=0;dropOverlay.classList.remove('show');}});
window.addEventListener('dragover',e=>{e.preventDefault();});
window.addEventListener('drop',async e=>{e.preventDefault();
  _dragDepth=0;dropOverlay.classList.remove('show');
  const files=[...((e.dataTransfer||{}).files||[])];
  for(const f of files){
    if(/\.mrpack$/i.test(f.name)){await handle_open_file(f);continue;}
    if(/\.zip$/i.test(f.name)){
      /* .zip 先按整合包识别（含 modrinth.index.json/manifest.json），否则作为本地文件添加 */
      let isPack=false;
      try{const z=await(await loadJsZip()).loadAsync(await f.arrayBuffer());
        isPack=!!(z.file('modrinth.index.json')||z.file('manifest.json'));}catch{}
      if(isPack){await handle_open_file(f);continue;}}
    if(/\.(jar|zip)$/i.test(f.name)){
      if(!INDEX_DATA){alert(tr('dialog_file_not_found'));continue;}
      await handle_local_jar_file(f);}}});
function ov_zip_path(k){
  if(k.startsWith('server-overrides/'))return k;
  if(PACK_FORMAT==='modrinth'&&k.startsWith('client-overrides/'))return k;
  if(PACK_FORMAT==='curseforge'&&k.startsWith('clientoverrides/'))return k;
  return 'overrides/'+k;}
function pick_overrides(){return new Promise(res=>{
  const inp=$('fileOverrides');let done=false;
  const finish=v=>{if(done)return;done=true;
    window.removeEventListener('focus',onfocus);
    try{inp.value='';}catch{}res(v);};
  const onfocus=()=>setTimeout(()=>{if(!done&&(!inp.files||!inp.files.length))finish(null);},300);
  const SPECIAL=PACK_FORMAT==='curseforge'?['clientoverrides']:['client-overrides','server-overrides'];
  inp.onchange=()=>{const files=[...inp.files].map(f=>{
    const wp=f.webkitRelativePath||'';const i=wp.indexOf('/');
    const top=i>0?wp.slice(0,i):'';
    let rel=i>0?wp.slice(i+1):wp;
    if(top&&SPECIAL.includes(top))rel=`${top}/${rel}`;  // 专用子目录保留包内根名
    return [f,rel];});
    finish(files);};
  setTimeout(()=>window.addEventListener('focus',onfocus),500);
  inp.click();});}
async function pack_to_mrpack(as_zip=false){
  if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  save_index_to_state();
  const data=JSON.parse(JSON.stringify(INDEX_DATA));
  if(!(data.files||[]).length){
    if(!confirm(tr('dialog_pack_empty')))return;}
  log(trf('log_pack_start',{path:as_zip?'.zip':'.mrpack'}));set_status(tr('status_loading'));
  try{
    const pack_data=data;const extra={};const written=new Set();
    const ovf=window._ovFiles||new Map();
    const localJ=window._localJars||new Map();
    if(localJ.size||ovf.size){
      // 仅打包当前仍登记在 files 中的本地文件，避免已删除条目复活
      const live=new Set((pack_data.files||[]).map(f=>f.path));
      const dlset=new Set((pack_data.files||[]).filter(f=>(f.downloads||[]).length).map(f=>f.path));
      let n=0;
      for(const path of live){
        if(dlset.has(path))continue;  // 带下载链接的由安装器下载，不打包
        const o=localJ.get(path)||ovf.get(path);
        if(o){extra[`overrides/${path}`]=o.file||o;written.add(path);n++;}}
      // 其余包内覆盖文件（config、未登记本地文件、server-overrides 等）按目录路由
      for(const[k,o]of ovf){
        if(live.has(k)||written.has(k))continue;
        extra[ov_zip_path(k)]=o.file||o;written.add(k);n++;}
      if(n)log(trf('log_ov_added',{n:n}),'SUCCESS');}
    let handle=null;
    const ext=as_zip?'.zip':'.mrpack';
    const suggested=`${pack_data.name||'modpack'}${ext}`;
    if(window.showSaveFilePicker){
      try{handle=await window.showSaveFilePicker({suggestedName:suggested,
        types:[as_zip?{description:'Zip Archive',accept:{'application/zip':['.zip']}}
          :{description:'Modrinth Modpack',accept:{'application/octet-stream':['.mrpack']}}]});}
      catch{set_status(tr('status_ready'));return;}}
    const name=handle?handle.name:suggested;
    const include_overrides=confirm(`${tr('dialog_confirm_overrides')}\n\n${tr('dialog_overrides_prompt')}`);
    let overrides_files=null;
    if(include_overrides){
      overrides_files=await pick_overrides();
      if(!overrides_files)log(tr('log_no_overrides'),'WARNING');}
    const zip=new(await loadJsZip())();
    zip.file('modrinth.index.json',JSON.stringify(pack_data,null,2));
    for(const[p,c]of Object.entries(extra))zip.file(p,c);
    if(overrides_files){let n=0;for(const[f,rel]of overrides_files){zip.file(ov_zip_path(rel),f);n++;}
      log(trf('log_ov_user_added',{n:n}),'SUCCESS');}
    progress_show();
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'},
      md=>progress_set(md.percent,100));
    progress_hide();
    if(handle){const w=await handle.createWritable();await w.write(blob);await w.close();}
    else dl_blob(blob,name);
    log(trf('log_pack',{path:name}),'SUCCESS');
    set_status(tr('status_packed'));
    alert(`${tr('status_packed')}\n${trf(as_zip?'dialog_pack_success_zip':'dialog_pack_success',{path:name})}`);
  }catch(e){progress_hide();log(trf('dialog_pack_fail',{error:e.message}),'ERROR');
    alert(trf('dialog_pack_fail',{error:e.message}));set_status(tr('status_ready'));}}
function export_zip_dispatch(){if(PACK_FORMAT==='curseforge')export_cf_zip();else pack_to_mrpack(true);}
async function export_cf_zip(){
  if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  save_index_to_state();
  const data=JSON.parse(JSON.stringify(INDEX_DATA));
  const include_overrides=confirm(`${tr('dialog_confirm_overrides')}\n\n${tr('dialog_overrides_prompt')}`);
  let overrides_files=null;
  if(include_overrides){overrides_files=await pick_overrides();
    if(!overrides_files)log(tr('log_no_overrides'),'WARNING');}
  log(tr('log_cf_pack_start'));set_status(tr('status_loading'));
  try{
    const deps=data.dependencies||{};const modLoaders=[];
    for(const[key,prefix]of[['fabric-loader','fabric'],['forge','forge'],['neoforge','neoforge']])
      if(deps[key])modLoaders.push({id:`${prefix}-${deps[key]}`,primary:true});
    const manifest={minecraft:{version:deps.minecraft||'',modLoaders},
      manifestType:'minecraftModpack',manifestVersion:1,
      name:data.name||'modpack',version:data.versionId||'1.0.0',files:[],overrides:'overrides'};
    const zip=new(await loadJsZip())();
    const files=data.files||[];const total=files.length;let i=0;
    const ovf=window._ovFiles||new Map();const usedRel=new Set();
    progress_show();
    for(const e of files){
      i++;
      if(e.cf){manifest.files.push({projectID:e.cf.projectID,fileID:e.cf.fileID,
        required:e.cf.required!==false});progress_set(i,total);continue;}
      const rel=String(e.path||'').replace(/\\/g,'/');
      if(!rel)continue;
      let buf=null;
      const lo=(window._localJars&&window._localJars.get(rel))||ovf.get(rel);
      if(lo){buf=await(lo.file?lo.file.arrayBuffer():lo.arrayBuffer());usedRel.add(rel);}
      else{const url=(e.downloads||[])[0];
        if(url){set_status(`${tr('status_downloading')} ${i}/${total}`);
          try{const r=await fetch(url,fetch_to());if(r.ok)buf=await r.arrayBuffer();}catch{}}}
      if(buf)zip.file(`overrides/${rel}`,buf);
      else log(trf('log_download_fail',{filename:rel.split('/').pop(),error:'no source'}),'ERROR');
      progress_set(i,total);}
    let nx=0;  // 包内其余覆盖文件（config、clientoverrides 等）
    for(const[k,o]of ovf){if(usedRel.has(k))continue;
      zip.file(ov_zip_path(k),o.file||o);nx++;}
    if(nx)log(trf('log_ov_added',{n:nx}),'SUCCESS');
    if(overrides_files){let n=0;for(const[f,rel]of overrides_files){zip.file(ov_zip_path(rel),f);n++;}
      log(trf('log_ov_user_added',{n:n}),'SUCCESS');}
    zip.file('manifest.json',JSON.stringify(manifest,null,2));
    /* 下载阶段 0-90%，压缩阶段 90-100% */
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'},
      md=>{$('progress').firstElementChild.style.width=(90+md.percent*0.1)+'%';});
    const suggested=`${data.name||'modpack'}.zip`;let name=suggested;
    if(window.showSaveFilePicker){
      let handle;
      try{handle=await window.showSaveFilePicker({suggestedName:suggested,
        types:[{description:'Zip Archive',accept:{'application/zip':['.zip']}}]});}
      catch{progress_hide();set_status(tr('status_ready'));return;}
      const w=await handle.createWritable();await w.write(blob);await w.close();name=handle.name;
    }else dl_blob(blob,name);
    log(trf('log_pack',{path:name}),'SUCCESS');
    progress_hide();
    alert(trf('cf_export_ok',{path:name}));
  }catch(e){progress_hide();log(trf('dialog_pack_fail',{error:e.message}),'ERROR');
    alert(trf('dialog_pack_fail',{error:e.message}));}
  set_status(tr('status_ready'));}

async function online_download(ver,title){
  const f=ver.files&&ver.files[0];
  if(!f){alert(tr('online_no_results'));return;}
  const fname=f.filename||`${title}.mrpack`;
  set_status(tr('online_downloading'));
  try{
    const r=await fetch(f.url,fetch_to());
    if(!r.ok)throw new Error('HTTP '+r.status);
    const blob=await r.blob();
    if(window.showSaveFilePicker){
      try{const h=await window.showSaveFilePicker({suggestedName:fname,
        types:[{description:'Modrinth Modpack',accept:{'application/octet-stream':['.mrpack']}}]});
        const w=await h.createWritable();await w.write(blob);await w.close();
      }catch{/* 用户取消保存则不自动打开 */set_status(tr('status_ready'));return;}}
    else dl_blob(blob,fname);
    set_status(tr('status_ready'));
    await handle_open_file(new File([blob],fname,{type:'application/octet-stream'}));
  }catch(e){set_status(tr('status_ready'));
    alert(trf('online_download_fail',{error:e.message}));}}

function detect_duplicates(){if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  const pack=INDEX_DATA,files=pack.files||[];
  const by_pid=new Map(),by_sha=new Map();
  files.forEach((f,i)=>{
    const pid=parse_project_id_from_url((f.downloads||[])[0]||'');
    if(pid){if(!by_pid.has(pid))by_pid.set(pid,[]);by_pid.get(pid).push(i);}
    const sha=f.hashes&&f.hashes.sha1;
    if(sha){if(!by_sha.has(sha))by_sha.set(sha,[]);by_sha.get(sha).push(i);}});
  const parent=files.map((_,i)=>i);
  function find(x){while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;}
  function union(a,b){const ra=find(a),rb=find(b);if(ra!==rb)parent[ra]=rb;}
  by_pid.forEach(idx=>{for(let i=1;i<idx.length;i++)union(idx[0],idx[i]);});
  by_sha.forEach(idx=>{for(let i=1;i<idx.length;i++)union(idx[0],idx[i]);});
  const groups=new Map();
  files.forEach((_,i)=>{const r=find(i);if(!groups.has(r))groups.set(r,[]);groups.get(r).push(i);});
  const dups=[...groups.values()].filter(g=>g.length>1).map(g=>g.map(i=>files[i]));
  if(!dups.length){alert(tr('dialog_dup_none'));log(tr('dialog_dup_none'),'SUCCESS');return;}
  log(trf('log_dup_found',{count:dups.length}));
  let removed=0;
  build_win(tr('dialog_dup_title'),'700px','520px',win=>{
    dups.forEach((g,gi)=>{
      win.bd.appendChild(el('div','font-size:13px;padding:6px 10px 2px',
        `${trf('dialog_dup_group',{count:g.length})} — ${(g[0].path||'').split(/[/\\]/).pop()}`,'bold-md'));
      g.forEach((entry,i)=>{
        const row=el('div',null,null,'sel-row');
        const c=el('div','flex:1',`[${i===0?tr('dup_keep'):tr('dup_extra')}] ${entry.path||''}`);
        row.appendChild(c);
        if(i>0){const del=mkbtn(tr('dialog_dup_delete_extras'),'btn-danger','110px',()=>{
          if(!confirm(trf('dialog_confirm_delete',{count:1})))return;
          if(INDEX_DATA!==pack){log(tr('log_async_pack_changed'),'WARNING');
            close_win();return;}
          /* 按对象身份删除：同 path 的"保留"条目不受影响 */
          remove_duplicate_entry(pack,entry,window._localJars,window._ovFiles);
          row.remove();removed++;removedLbl.textContent=trf('log_delete_mod',{count:removed});
          refresh_mod_list();save_index_to_state();});
          row.appendChild(del);}
        win.bd.appendChild(row);});});
    const removedLbl=el('div','text-align:center;padding:6px',trf('log_delete_mod',{count:removed}),'hint');
    win.bd.appendChild(removedLbl);
    win.ft.append(mkbtn(tr('button_close'),'btn-gray','80px',close_win));});}
async function compatibility_check(){if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}

    bad.forEach(b=>{
      const row=el('div',null,null,'sel-row');
      [{w:240,v:b.name||b.filename},{w:80,v:b.mc_ok?'✅':'❌'},
       {w:90,v:b.ld_ok?'✅':'❌'},{w:180,v:b.gv||'-'},{w:160,v:b.ld||'-'}]

function pre_pack_check(){if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  const files=current_files();const no_url=[],no_path=[];
  files.forEach(f=>{
    if(!f.downloads||!f.downloads.length||!f.downloads[0])no_url.push(f);
    if(!f.path)no_path.push(f);});
  if(!no_url.length&&!no_path.length){alert(tr('dialog_prepack_ok'));
    log(tr('dialog_prepack_ok'),'SUCCESS');return;}
  log(tr('dialog_prepack_problems'),'WARNING');
  build_win(tr('dialog_prepack_title'),'600px','440px',win=>{
    const sec=txt=>win.bd.appendChild(el('div','font-weight:600;margin:6px 0 2px;color:var(--accent)',txt));
    const item=txt=>win.bd.appendChild(el('div','padding:1px 14px;font-size:12px',txt));
    if(no_url.length){sec(trf('dialog_prepack_no_url',{n:no_url.length}));
      no_url.forEach(f=>item((f.path||'?').split(/[/\\]/).pop()));}
    if(no_path.length){sec(trf('dialog_prepack_no_path',{n:no_path.length}));
      no_path.forEach(f=>item(JSON.stringify(f).slice(0,80)));}
    win.ft.append(mkbtn(tr('button_close'),'btn-gray','80px',close_win));});}
async function download_all_mods(){
  if(!INDEX_DATA){alert(tr('dialog_file_not_found'));return;}
  const files=current_files();
  if(!files.length){alert(tr('dialog_no_mods'));return;}
  set_status(tr('status_downloading'));progress_show();
  log(trf('log_dl_all_start',{count:files.length}));
  let ok=0,fail=0;
  for(let i=0;i<files.length;i++){
    const e=files[i];
    const fn=String(e.path||'').split(/[/\\]/).pop();
    progress_set(i+1,files.length);
    if(window._localJars&&window._localJars.has(e.path)){ok++;continue;}
    if(window._ovFiles&&window._ovFiles.has(e.path)){ok++;continue;}
    const url=(e.downloads||[])[0];
    if(!url){fail++;log(trf('log_skip_nolink',{filename:fn}),'WARNING');continue;}
    set_status(`${tr('status_downloading')} ${i+1}/${files.length}`);
    try{const r=await fetch(url,fetch_to());
      if(!r.ok)throw new Error('HTTP '+r.status);
      const buf=await r.arrayBuffer();
      if(e.hashes&&e.hashes.sha1){
        const s1=await sha1_hex(buf);
        if(s1!==e.hashes.sha1)throw new Error('SHA1 mismatch');}
      dl_blob(new Blob([buf]),fn);ok++;
      log(trf('log_download_done',{filename:fn}),'SUCCESS');
    }catch(err){fail++;
      log(trf('log_download_fail',{filename:fn,error:err.message}),'ERROR');}}
  progress_hide();
  set_status(tr('status_ready'));
  log(trf('dlg_dl_all_done',{ok,fail}),fail?'WARNING':'SUCCESS');
  alert(trf('dlg_dl_all_done',{ok,fail}));}

/* Fluent Web Components 主题对接（懒加载完成后挂接） */
function _fluent_theme_hook(){
  try{
    const {setTheme,webLightTheme,webDarkTheme}=window.FluentUIWebComponents||{};
    if(setTheme){
      window.applyFluentTheme=(isDark)=>setTheme(isDark?webDarkTheme:webLightTheme);
      window.applyFluentTheme(CURRENT_THEME==='dark');}
  }catch(e){console.warn('Fluent theme init skipped:',e);}}
loadFluentUI().then(_fluent_theme_hook).catch(()=>{});
