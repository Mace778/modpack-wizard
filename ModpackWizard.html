<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModpackWizard</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --line: #dde3ee;
      --text: #1f2937;
      --muted: #667085;
      --accent: #2563eb;
      --accent-strong: #1749c9;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      --radius: 14px;
      --radius-sm: 10px;
      --nav-width: 190px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    button, input, select {
      font: inherit;
    }

    #app {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
      z-index: 2;
    }

    #brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    #brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--accent);
      white-space: nowrap;
    }

    #brand-sub {
      font-size: 0.9rem;
      color: var(--muted);
      white-space: nowrap;
    }

    #main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    #nav {
      width: var(--nav-width);
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-title {
      padding: 6px 12px 12px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      text-align: left;
      border-radius: 10px;
      padding: 11px 12px;
      cursor: pointer;
      transition: 120ms ease;
      font-weight: 600;
    }

    .nav-btn:hover {
      border-color: var(--line);
      background: var(--panel-2);
    }

    .nav-btn.active {
      background: rgba(37, 99, 235, 0.08);
      border-color: rgba(37, 99, 235, 0.18);
      color: var(--accent-strong);
    }

    #content {
      flex: 1;
      min-width: 0;
      padding: 22px;
      overflow: auto;
    }

    .page {
      display: none;
      min-height: 100%;
    }

    .page.active {
      display: block;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    #home {
      display: grid;
      place-items: center;
      min-height: 100%;
    }

    .home-box {
      width: min(760px, 100%);
      padding: 30px 24px;
      text-align: center;
    }

    .home-title {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .home-sub {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1rem;
    }

    .card-grid {
      display: grid;
      gap: 12px;
    }

    .home-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: transform 120ms ease, border-color 120ms ease;
      font-weight: 700;
      font-size: 1.06rem;
    }

    .home-card:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .home-card small {
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 400;
    }

    .settings-box {
      max-width: 680px;
      padding: 22px 20px;
      margin: 0 auto;
    }

    .section {
      margin-bottom: 18px;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .label {
      min-width: 90px;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      max-width: 280px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 10px;
      padding: 9px 10px;
      color: var(--text);
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-2);
      color: var(--text);
      padding: 9px 14px;
      cursor: pointer;
      transition: 120ms ease;
      font-weight: 600;
    }

    button:hover {
      border-color: var(--accent);
    }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .success {
      background: rgba(22, 163, 74, 0.08);
      border-color: rgba(22, 163, 74, 0.18);
      color: var(--success);
    }

    .danger {
      background: rgba(220, 38, 38, 0.06);
      border-color: rgba(220, 38, 38, 0.2);
      color: var(--danger);
    }

    .muted {
      color: var(--muted);
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      #main {
        flex-direction: column;
      }

      #nav {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--line);
        flex-direction: row;
        flex-wrap: wrap;
      }

      .nav-title {
        display: none;
      }

      #content {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="brand">
        <div id="brand-title">ModpackWizard</div>
        <div id="brand-sub">Simple desktop UI</div>
      </div>
    </header>

    <div id="main">
      <nav id="nav" aria-label="Main navigation">
        <div class="nav-title">Menu</div>
        <button class="nav-btn active" data-page="home">Home</button>
        <button class="nav-btn" data-page="edit">Edit Pack</button>
        <button class="nav-btn" data-page="settings">Settings</button>
      </nav>

      <main id="content">
        <section id="home" class="page active">
          <div class="panel home-box">
            <h1 class="home-title">ModpackWizard</h1>
            <div class="home-sub">Modpack management for Modrinth and CurseForge workflows.</div>
            <div class="card-grid">
              <button class="home-card" type="button">
                <span>Import Local Pack</span>
                <small>Open a .mrpack or .zip file</small>
              </button>
              <button class="home-card" type="button">
                <span>Import by Name</span>
                <small>Search online and download a pack</small>
              </button>
              <button class="home-card" type="button">
                <span>New Pack</span>
                <small>Create a new pack in Modrinth or CurseForge format</small>
              </button>
            </div>
          </div>
        </section>

        <section id="edit" class="page">
          <div class="panel settings-box">
            <div class="section">
              <h2>Pack information</h2>
              <div class="row">
                <span class="label">Name</span>
                <input type="text" value="My Modpack" aria-label="Pack name" />
              </div>
              <div class="row">
                <span class="label">Version</span>
                <input type="text" value="1.0.0" aria-label="Pack version" />
              </div>
              <div class="row">
                <span class="label">MC</span>
                <select aria-label="MC version">
                  <option>1.20.1</option>
                  <option>1.19.2</option>
                </select>
              </div>
              <div class="row">
                <span class="label">Loader</span>
                <select aria-label="Loader">
                  <option>Fabric</option>
                  <option>Forge</option>
                  <option>NeoForge</option>
                </select>
              </div>
            </div>

            <div class="section">
              <h2>Actions</h2>
              <div class="row">
                <button type="button" class="primary">Pack .mrpack</button>
                <button type="button">Export List</button>
                <button type="button" class="success">Check Updates</button>
                <button type="button" class="danger">Delete Selected</button>
              </div>
            </div>
          </div>
        </section>

        <section id="settings" class="page">
          <div class="panel settings-box">
            <div class="section">
              <h2>General</h2>
              <div class="muted">
                This interface uses a clean standard desktop style with no WinUI or Fluent visual layer.
              </div>
            </div>

            <div class="section">
              <h2>Appearance</h2>
              <div class="row">
                <span class="label">Language</span>
                <select>
                  <option>中文</option>
                  <option>English</option>
                </select>
              </div>
              <div class="row">
                <span class="label">Theme</span>
                <select>
                  <option>Light</option>
                  <option>Dark</option>
                </select>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    document.querySelectorAll('.nav-btn').forEach((button) => {
      button.addEventListener('click', () => {
        const target = button.dataset.page;
        document.querySelectorAll('.nav-btn').forEach((item) => {
          item.classList.toggle('active', item === button);
        });
        document.querySelectorAll('.page').forEach((page) => {
          page.classList.toggle('active', page.id === target);
        });
      });
    });
  </script>
</body>
</html>
